name: Bug
description: Something does not work
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    attributes:
      label: Agent log
      description: "`kubectl -n kubernanny logs deploy/kubernanny` (remove the pairing code)."
      render: text
  - type: input
    attributes:
      label: Versions
      description: Agent, app or browser, Kubernetes distribution and version.
