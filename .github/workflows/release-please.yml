name: Release Please

# Keeps a release pull request open for the next version of the agent, the
# chart and the relay (docs/RELEASING.md): version and CHANGELOG.md entry from
# the conventional commits since the last release, every version file bumped
# (release-please-config.json). Merging it tags vX.Y.Z and creates the GitHub
# release; a tag pushed with GITHUB_TOKEN starts no workflow, so this one
# then runs CI on the tag, which publishes the images and the chart.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # CI on the new tag: release-check, the suites, then images and chart under the tag's version.
      - if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
