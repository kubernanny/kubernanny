name: Relay

# Deploys the Cloudflare Worker relay to relay.kubernanny.app, the default relay of the chart
# (relay.url). Tests run in CI (ci.yml); this workflow typechecks and ships. Without the Cloudflare
# secrets it does nothing.
on:
  push:
    branches: [main]
    paths:
      - 'relay/cloudflare/**'
      - 'relay/src/**'
      - 'protocol/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: relay
      url: https://relay.kubernanny.app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing is deployed."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            relay/package-lock.json
            relay/cloudflare/package-lock.json
      - run: npm ci && npm run build
        if: steps.secrets.outputs.present == 'true'
        working-directory: protocol
      # The Worker imports the relay's core (relay/src), which resolves @kubernanny/protocol from here.
      - run: npm ci
        if: steps.secrets.outputs.present == 'true'
        working-directory: relay
      - name: Typecheck and deploy
        if: steps.secrets.outputs.present == 'true'
        working-directory: relay/cloudflare
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --domain relay.kubernanny.app --var RELAY_PUBLIC_URL:https://relay.kubernanny.app
