name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Every job reads only; the publishing jobs below grant themselves packages
# and id-token. Third-party actions are pinned by commit (the comment names the
# release), so a moved tag cannot change what runs with those permissions.
permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: protocol/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the cross-test against libsodium and the published test vectors.
      - run: npm test

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci && npm run build
        working-directory: protocol
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: protocol
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run test:scripts
      # The Java copy of the push decryption, against protocol/test/push-vectors.json (runner JDK).
      - run: npm test
        working-directory: app/native/push
      - run: npx ng build
      # The demo host build (demo.kubernanny.app): no pairing, no agent calls (src/environments/build-flags.ts).
      - run: npm run build:demo

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci && npm run build
        working-directory: protocol
      # The end-to-end test starts a real demo agent behind the relay.
      - run: npm ci
        working-directory: agent
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Cloudflare Worker typecheck and bundle
        working-directory: relay/cloudflare
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run --outdir dist

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint and validate
        env:
          # kubeconform v0.7.0, linux-amd64, from the release's CHECKSUMS file.
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "$KUBECONFORM_SHA256  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz -C /usr/local/bin kubeconform
          helm lint deploy/helm/kubernanny
          for values in "" "--set ingress.enabled=true --set serviceMonitor.enabled=true --set rbac.allowActions=false --set notifications.ntfyUrl=https://ntfy.sh/x" "--set relay.enabled=true --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true --set networkPolicy.egress.internetHttps=false"; do
            helm template kubernanny deploy/helm/kubernanny -n kubernanny $values | kubeconform -strict -ignore-missing-schemas -summary
          done
          kubeconform -strict -summary deploy/install.yaml
      # The switches in values.yaml must really take the permissions away (rules generated from files/rbac.json).
      - name: RBAC follows the switches
        run: |
          render() { helm template kubernanny deploy/helm/kubernanny -n kubernanny "$@"; }
          render | grep -q 'argoproj.io'
          ! render --set 'checks.disabled={argocd}' | grep -q 'argoproj.io'
          ! render --set 'actions.disabled={restart}' | grep -A2 '"apps"' | grep -q '"patch"'
          render --set 'actions.disabled={argocd-sync}' | grep -q '"patch"'
          ! render --set rbac.allowActions=false | grep -Eq '"(patch|create)"'
          ! render --set 'actions.disabled={logs}' | grep -q 'pods/log'
          # vulnerabilities.allowAccept: false must reach the agent (it then refuses and ignores acceptances).
          ! render | grep -q 'VULN_ACCEPT'
          render --set vulnerabilities.allowAccept=false | grep -A1 'name: VULN_ACCEPT' | grep -q '"off"'
          # notifications.appPush.enabled: false must reach the agent as APP_PUSH=off.
          ! render | grep -q 'APP_PUSH'
          render --set notifications.appPush.enabled=false | grep -A1 'name: APP_PUSH' | grep -q '"off"'
          render | grep -q 'ceph.rook.io'
          ! render --set 'checks.disabled={rook-ceph,kyverno,gatekeeper}' | grep -Eq 'ceph.rook.io|kyverno.io|wgpolicyk8s.io|gatekeeper.sh'
          # image-updates: off unless enabled, and no registry egress once checks.disabled names it.
          np() { render --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true --set networkPolicy.egress.internetHttps=false "$@"; }
          ! render | grep -q 'image-updates'
          np --set imageUpdates.enabled=true | grep -q 'image-updates module'
          np --set imageUpdates.enabled=true | grep -q 'value: "image-updates"'
          ! np --set imageUpdates.enabled=true --set 'checks.disabled={image-updates}' | grep -q 'image-updates module'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        run: |
          for dir in protocol agent app e2e; do (cd "$dir" && npm ci); done
      - name: Build
        working-directory: e2e
        run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # The web demo and a real agent serving its web UI, on a phone and a desktop viewport.
      - run: npm test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report

  image:
    needs: [protocol, agent, app, chart, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing with the workflow's own identity (Sigstore).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Expressions go through env, never into the script text.
      - id: tags
        env:
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=ghcr.io/$OWNER/agent:${GITHUB_REF_NAME#v},ghcr.io/$OWNER/agent:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/$OWNER/agent:$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER},ghcr.io/$OWNER/agent:edge" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Build provenance and an SBOM travel with the image as attestations.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      # Signs the digest, not a tag. The certificate names this workflow file and
      # the ref it ran for; verify with
      # cosign verify ghcr.io/kubernanny/agent@<digest> --certificate-identity-regexp '^https://github\.com/kubernanny/kubernanny/\.github/workflows/ci\.yml@refs/(tags/v.*|heads/main)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - env:
          OWNER_NAME: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "ghcr.io/$OWNER/agent@$DIGEST"

  relay-image:
    needs: [protocol, relay]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=ghcr.io/$OWNER/relay:${GITHUB_REF_NAME#v},ghcr.io/$OWNER/relay:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/$OWNER/relay:edge" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - env:
          OWNER_NAME: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "ghcr.io/$OWNER/relay@$DIGEST"

  helm-release:
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - env:
          OWNER_NAME: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm package deploy/helm/kubernanny --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
          helm push kubernanny-*.tgz "oci://ghcr.io/$OWNER/charts" 2>&1 | tee push.log
          DIGEST=$(grep -o 'sha256:[0-9a-f]*' push.log | head -1)
          cosign sign --yes "ghcr.io/$OWNER/charts/kubernanny@$DIGEST"
