name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Every job reads only; the publishing jobs below grant themselves packages
# and id-token. Third-party actions are pinned by commit (the comment names the
# release), so a moved tag cannot change what runs with those permissions.
permissions:
  contents: read

jobs:
  # Which parts a push or pull request touches, so a docs fix does not run the
  # app and relay suites. Tags, the first push and changes to this workflow run
  # everything. Plain git, no third-party action.
  changes:
    runs-on: ubuntu-latest
    outputs:
      protocol: ${{ steps.paths.outputs.protocol }}
      agent: ${{ steps.paths.outputs.agent }}
      app: ${{ steps.paths.outputs.app }}
      relay: ${{ steps.paths.outputs.relay }}
      chart: ${{ steps.paths.outputs.chart }}
      e2e: ${{ steps.paths.outputs.e2e }}
      image: ${{ steps.paths.outputs.image }}
      relay_image: ${{ steps.paths.outputs.relay_image }}
      lint: ${{ steps.paths.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          base="$BEFORE"
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; fi
          all=false
          case "$REF" in refs/tags/*) all=true ;; esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then all=true; fi
          files=""
          if [ "$all" = false ]; then files=$(git diff --name-only "$base" "$HEAD"); fi
          if printf '%s\n' "$files" | grep -q '^\.github/workflows/ci\.yml$'; then all=true; fi
          # Each part with what its tests read: agent tests check docs/ and the chart, the app's icon test reads the agent's modules,
          # the relay's end-to-end test starts a real agent.
          hit() { if [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$1"; then echo "$2=true"; else echo "$2=false"; fi; }
          {
            hit '^protocol/' protocol
            hit '^(protocol|agent|deploy|docs)/' agent
            hit '^(protocol|app|agent/src)/' app
            hit '^(protocol|relay|agent|deploy/relay)/' relay
            hit '^deploy/' chart
            hit '^(protocol|agent|app|e2e)/' e2e
            hit '^(protocol|agent|app)/|^Dockerfile$|^\.dockerignore$' image
            hit '^(protocol|relay)/' relay_image
            hit '^(protocol|agent|app|relay|website|e2e)/|^(package(-lock)?\.json|eslint\.config\.mjs|\.prettierrc)$' lint
          } | tee -a "$GITHUB_OUTPUT"

  # A v* tag publishes images and the chart under the tag's version: refuse it
  # before anything is pushed when Chart.yaml, the manifests, the agent or the
  # changelog say otherwise.
  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

  protocol:
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: protocol/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the cross-test against libsodium and the published test vectors.
      - run: npm run test:coverage   # coverage as a report in the log, no threshold

  # ESLint and Prettier over every package, with the shared config at the
  # root (eslint.config.mjs). Each package is installed so the type-aware
  # rules see its dependencies.
  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm ci && npm run build
        working-directory: protocol
      - run: for p in agent relay relay/cloudflare app website e2e; do npm ci --prefix "$p" || exit 1; done
      - run: npm run lint

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci && npm run build
        working-directory: protocol
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage   # coverage as a report in the log, no threshold

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: protocol
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run test:scripts
      # The Java copy of the push decryption, against protocol/test/push-vectors.json (runner JDK).
      - run: npm test
        working-directory: app/native/push
      - run: npx ng build
      # The demo host build (demo.kubernanny.app): no pairing, no agent calls (src/environments/build-flags.ts).
      - run: npm run build:demo

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci && npm run build
        working-directory: protocol
      # The end-to-end test starts a real demo agent behind the relay.
      - run: npm ci
        working-directory: agent
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage   # coverage as a report in the log, no threshold
      - name: Cloudflare Worker typecheck and bundle
        working-directory: relay/cloudflare
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run --outdir dist

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint and validate
        env:
          # kubeconform v0.7.0, linux-amd64, from the release's CHECKSUMS file.
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "$KUBECONFORM_SHA256  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz -C /usr/local/bin kubeconform
          helm lint deploy/helm/kubernanny
          for values in "" "--set ingress.enabled=true --set serviceMonitor.enabled=true --set rbac.allowActions=false --set notifications.ntfyUrl=https://ntfy.sh/x" "--set relay.enabled=true --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true --set networkPolicy.egress.internetHttps=false"; do
            helm template kubernanny deploy/helm/kubernanny -n kubernanny $values | kubeconform -strict -ignore-missing-schemas -summary
          done
          kubeconform -strict -summary deploy/install.yaml
      # The switches in values.yaml must really take the permissions away (rules generated from files/rbac.json).
      - name: RBAC follows the switches
        run: |
          render() { helm template kubernanny deploy/helm/kubernanny -n kubernanny "$@"; }
          render | grep -q 'argoproj.io'
          ! render --set 'checks.disabled={argocd}' | grep -q 'argoproj.io'
          ! render --set 'actions.disabled={restart}' | grep -A2 '"apps"' | grep -q '"patch"'
          render --set 'actions.disabled={argocd-sync}' | grep -q '"patch"'
          ! render --set rbac.allowActions=false | grep -Eq '"(patch|create)"'
          ! render --set 'actions.disabled={logs}' | grep -q 'pods/log'
          # vulnerabilities.allowAccept: false must reach the agent (it then refuses and ignores acceptances).
          ! render | grep -q 'VULN_ACCEPT'
          render --set vulnerabilities.allowAccept=false | grep -A1 'name: VULN_ACCEPT' | grep -q '"off"'
          # notifications.appPush.enabled: false must reach the agent as APP_PUSH=off.
          ! render | grep -q 'APP_PUSH'
          render --set notifications.appPush.enabled=false | grep -A1 'name: APP_PUSH' | grep -q '"off"'
          # notifications.appPush.widgetRefreshMinutes: the default sets nothing, 0 reaches the agent as off.
          ! render | grep -q 'WIDGET_REFRESH_MINUTES'
          render --set notifications.appPush.widgetRefreshMinutes=0 | grep -A1 'name: WIDGET_REFRESH_MINUTES' | grep -q '"0"'
          render | grep -q 'ceph.rook.io'
          ! render --set 'checks.disabled={rook-ceph,kyverno,gatekeeper}' | grep -Eq 'ceph.rook.io|kyverno.io|wgpolicyk8s.io|gatekeeper.sh'
          # image-updates: off unless enabled, and no registry egress once checks.disabled names it.
          np() { render --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true --set networkPolicy.egress.internetHttps=false "$@"; }
          ! render | grep -q 'image-updates'
          np --set imageUpdates.enabled=true | grep -q 'image-updates module'
          np --set imageUpdates.enabled=true | grep -q 'value: "image-updates"'
          ! np --set imageUpdates.enabled=true --set 'checks.disabled={image-updates}' | grep -q 'image-updates module'

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        run: |
          for dir in protocol agent app e2e; do (cd "$dir" && npm ci); done
      - name: Build
        working-directory: e2e
        run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # The web demo and a real agent serving its web UI, on a phone and a desktop viewport.
      - run: npm test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report

  image:
    needs: [changes, release-check, protocol, agent, app, chart, e2e]
    # Skipped test jobs (nothing of theirs changed) do not block it; a failed or cancelled one does.
    if: github.event_name == 'push' && !cancelled() && !failure() && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing with the workflow's own identity (Sigstore).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Expressions go through env, never into the script text.
      - id: tags
        env:
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD="${GITHUB_REF_NAME#v}"
            echo "tags=ghcr.io/$OWNER/agent:$BUILD,ghcr.io/$OWNER/agent:latest" >> "$GITHUB_OUTPUT"
          else
            BUILD="$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
            echo "tags=ghcr.io/$OWNER/agent:$BUILD,ghcr.io/$OWNER/agent:edge" >> "$GITHUB_OUTPUT"
          fi
          # Baked into the image, so the agent can say which build it is.
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            KUBERNANNY_BUILD=${{ steps.tags.outputs.build }}
            KUBERNANNY_COMMIT=${{ github.sha }}
          # Build provenance and an SBOM travel with the image as attestations.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      # Signs the digest, not a tag. The certificate names this workflow file and
      # the ref it ran for; verify with
      # cosign verify ghcr.io/kubernanny/agent@<digest> --certificate-identity-regexp '^https://github\.com/kubernanny/kubernanny/\.github/workflows/ci\.yml@refs/(tags/v.*|heads/main)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - env:
          OWNER_NAME: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "ghcr.io/$OWNER/agent@$DIGEST"

  relay-image:
    needs: [changes, release-check, protocol, relay]
    if: github.event_name == 'push' && !cancelled() && !failure() && needs.changes.outputs.relay_image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=ghcr.io/$OWNER/relay:${GITHUB_REF_NAME#v},ghcr.io/$OWNER/relay:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/$OWNER/relay:edge" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - env:
          OWNER_NAME: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "ghcr.io/$OWNER/relay@$DIGEST"

  helm-release:
    needs: [release-check, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - env:
          OWNER_NAME: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "$OWNER_NAME" | tr '[:upper:]' '[:lower:]')
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm package deploy/helm/kubernanny --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
          helm push kubernanny-*.tgz "oci://ghcr.io/$OWNER/charts" 2>&1 | tee push.log
          DIGEST=$(grep -o 'sha256:[0-9a-f]*' push.log | head -1)
          # cosign keeps its own registry login; helm's does not reach it.
          echo "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$REGISTRY_USER" --password-stdin
          cosign sign --yes "ghcr.io/$OWNER/charts/kubernanny@$DIGEST"
