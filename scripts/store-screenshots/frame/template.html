<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- One store screenshot: headline on the brand background, the app inside a
     generic device drawn in CSS (no real device images, no trademarks).
     frame.cjs fills it through window.renderShot. Fonts arrive as @font-face
     with data URLs from the app's own packages. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f1626; }
  body { -webkit-font-smoothing: antialiased; }

  #canvas {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    color: #e9edf7;
    /* The website's ground with the three lights of the nanny's eye. */
    background:
      radial-gradient(ellipse 70% 38% at 12% 4%, rgba(54, 214, 168, .30), rgba(54, 214, 168, 0) 70%),
      radial-gradient(ellipse 60% 34% at 92% 14%, rgba(245, 184, 61, .20), rgba(245, 184, 61, 0) 70%),
      radial-gradient(ellipse 80% 40% at 80% 88%, rgba(255, 93, 115, .16), rgba(255, 93, 115, 0) 70%),
      radial-gradient(ellipse 90% 60% at 50% 35%, #1f2a46 0%, #0f1626 75%);
  }
  /* A faint grid, like the dots of a status board, only behind the copy. */
  #canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(233, 237, 247, .07) 1.2px, transparent 1.6px);
    background-size: var(--dot) var(--dot);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.6) 30%, transparent 55%);
  }

  .copy {
    position: absolute;
    left: 6%;
    right: 6%;
    top: var(--copy-top);
    bottom: var(--copy-bottom);
    display: flex;
    flex-direction: column;
    justify-content: var(--copy-align);
    align-items: center;
    text-align: center;
  }
  .lights { display: flex; gap: calc(var(--headline-size) * .16); margin-bottom: calc(var(--headline-size) * .42); }
  .lights i { display: block; width: calc(var(--headline-size) * .17); aspect-ratio: 1; border-radius: 50%; }
  .brand {
    display: flex;
    align-items: center;
    gap: calc(var(--headline-size) * .28);
    margin-bottom: calc(var(--headline-size) * .3);
    font-family: 'Bricolage', sans-serif;
    font-weight: 700;
    font-size: calc(var(--headline-size) * .5);
    letter-spacing: -.01em;
  }
  .brand img {
    width: calc(var(--headline-size) * 1.05);
    border-radius: 23%;
    box-shadow: 0 calc(var(--headline-size) * .12) calc(var(--headline-size) * .4) rgba(0, 0, 0, .45), 0 0 0 1px rgba(233, 237, 247, .12);
  }
  h1 {
    font-family: 'Bricolage', sans-serif;
    font-size: var(--headline-size);
    font-weight: 780;
    line-height: 1.04;
    letter-spacing: -.025em;
    text-wrap: balance;
  }
  p.sub {
    margin-top: .38em;
    font-family: 'Figtree', sans-serif;
    font-size: var(--sub-size);
    font-weight: 600;
    line-height: 1.15;
    color: #b7c2e3;
    text-wrap: balance;
  }

  .device {
    position: absolute;
    width: var(--device-w);
    padding: var(--bezel-y) var(--bezel-x);
    border-radius: var(--radius);
    background: linear-gradient(160deg, #2a3045 0%, #12151d 35%, #0b0d12 100%);
    /* A light rim, so the dark body stands off the dark ground. */
    box-shadow:
      inset 0 0 0 calc(var(--device-w) * .0035) #5a6382,
      inset 0 0 0 calc(var(--device-w) * .009) #10131a,
      0 0 calc(var(--device-w) * .1) rgba(142, 162, 255, .16),
      0 calc(var(--device-w) * .05) calc(var(--device-w) * .12) rgba(0, 0, 0, .55);
  }
  .button {
    position: absolute;
    width: calc(var(--device-w) * .008);
    border-radius: 2px;
    background: #3a4158;
  }
  .screen {
    position: relative;
    overflow: hidden;
    border-radius: var(--screen-radius);
    background: #0f1626;
  }
  .screen > img { display: block; width: 100%; height: auto; }
  /* A whole device screenshot (home screen with widgets): its own status bar, cut to the screen's shape. */
  .screen > img.device-shot { height: var(--screen-h); object-fit: cover; object-position: top; }

  .island, .punch, .camera {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: #030405;
    z-index: 3;
  }
  .island { top: calc(var(--screen-w) * .025); width: 29%; height: calc(var(--screen-w) * .085); border-radius: 999px; }
  .punch { top: calc(var(--status-h) * .5); width: calc(var(--screen-w) * .04); aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
  .camera { top: calc(var(--bezel-y) * .5 - var(--device-w) * .005); width: calc(var(--device-w) * .01); aspect-ratio: 1; border-radius: 50%; background: #262b38; }

  .banner-text {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }
  .banner-text .brand { font-weight: 720; }
  .banner-text .brand img { border-radius: 23%; box-shadow: 0 .12em .4em rgba(0, 0, 0, .45), 0 0 0 1px rgba(233, 237, 247, .12); }
  .banner-text h1 { text-wrap: balance; }
  .banner-line { position: absolute; left: 6%; right: 6%; text-align: center; text-wrap: balance; }

  /* Drawn over the room the app left for it (safe area), in the app's dark theme. */
  .status {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: var(--status-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--status-pad);
    font-family: 'Figtree', sans-serif;
    font-weight: 650;
    font-size: var(--status-font);
    color: #e9edf7;
    z-index: 2;
  }
  .status.island-bar { padding-top: calc(var(--screen-w) * .012); }
  .status .icons { display: flex; align-items: center; gap: calc(var(--status-font) * .35); }
  .status svg { height: calc(var(--status-font) * .82); width: auto; fill: currentColor; }
  .home {
    position: absolute;
    left: 50%;
    bottom: calc(var(--screen-w) * .018);
    width: var(--home-w);
    height: calc(var(--screen-w) * .011);
    transform: translateX(-50%);
    border-radius: 999px;
    background: rgba(233, 237, 247, .85);
    z-index: 2;
  }
</style>
</head>
<body>
<div id="canvas"></div>
<script>
  const SIGNAL = '<svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>';
  const WIFI = '<svg viewBox="0 0 16 12"><path d="M8 2.2c2.5 0 4.8 1 6.5 2.6l1.3-1.4C13.7 1.3 11 0 8 0S2.3 1.3.2 3.4l1.3 1.4C3.2 3.2 5.5 2.2 8 2.2zm0 3.6c1.5 0 2.9.6 3.9 1.6l1.3-1.4C11.8 4.6 10 3.8 8 3.8s-3.8.8-5.2 2.2L4.1 7.4c1-1 2.4-1.6 3.9-1.6zM8 9.4c-.6 0-1.2.3-1.6.7L8 12l1.6-1.9c-.4-.4-1-.7-1.6-.7z"/></svg>';
  const BATTERY = '<svg viewBox="0 0 27 12"><rect x=".6" y=".6" width="22.8" height="10.8" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".45"/><rect x="2.4" y="2.4" width="17" height="7.2" rx="1.6"/><rect x="24.6" y="4" width="1.6" height="4" rx=".8" opacity=".45"/></svg>';

  /**
   * One device with its screen: a generic phone or tablet drawn in CSS.
   * `frame` picks it: island (iPhone), punch (Android phone), tablet. An app
   * shot leaves room at the top and bottom (statusShare, bottomShare), where
   * the status bar and the home indicator are drawn; a `deviceShot` is a whole
   * device screenshot with its own status bar, so nothing is drawn over it.
   * `style` positions the device (absolute). Returns the markup.
   */
  window.deviceMarkup = ({ frame, deviceW, screenAspect, statusShare, bottomShare, screenshot, android, deviceShot, style = '' }) => {
    const tablet = frame === 'tablet';
    const kx = ({ island: .03, punch: .026, tablet: .036 })[frame];
    const bezelX = deviceW * kx;
    const bezelY = deviceW * kx;
    const radius = deviceW * ({ island: .155, punch: .1, tablet: .06 })[frame];
    const screenW = deviceW - 2 * bezelX;
    const screenH = screenW / screenAspect;
    const statusH = screenH * statusShare;
    const vars = {
      '--device-w': deviceW + 'px',
      '--bezel-x': bezelX + 'px',
      '--bezel-y': bezelY + 'px',
      '--radius': radius + 'px',
      '--screen-radius': Math.max(radius - bezelX, deviceW * .012) + 'px',
      '--screen-w': screenW + 'px',
      '--screen-h': screenH + 'px',
      '--status-h': statusH + 'px',
      '--status-font': Math.min(statusH * (tablet ? .5 : .36), screenW * (tablet ? .02 : .042)) + 'px',
      '--status-pad': screenW * (tablet ? .03 : frame === 'island' ? .085 : .05) + 'px',
      '--home-w': screenW * (tablet ? .2 : .36) + 'px',
    };
    const css = Object.entries(vars).map(([k, v]) => `${k}:${v}`).join(';');
    const time = android ? '9:41' : '9:41';
    const status = statusH > 0 && !deviceShot
      ? `<div class="status ${frame === 'island' ? 'island-bar' : ''}"><span>${time}</span><span class="icons">${SIGNAL}${WIFI}${BATTERY}</span></div>`
      : '';
    // The island and the camera hole are not in a device screenshot either, so they are drawn on both.
    const cutout = { island: '<div class="island"></div>', punch: '<div class="punch"></div>', tablet: '' }[frame];
    // Side buttons: one on the right, two on the left for phones.
    const btn = (side, top, h) => `<div class="button" style="${side}:${-deviceW * .006}px;top:${top}%;height:${h}%"></div>`;
    const buttons = tablet
      ? `<div class="button" style="top:${-deviceW * .006}px;right:12%;width:6%;height:${deviceW * .008}px"></div>`
      : btn('right', 24, 9) + btn('left', 18, 4) + btn('left', 25, 7) + btn('left', 34, 7);
    return `
      <div class="device" style="${css};${style}">
        ${buttons}
        ${tablet ? '<div class="camera"></div>' : ''}
        <div class="screen">
          ${cutout}
          ${status}
          <img src="${screenshot}"${deviceShot ? ' class="device-shot"' : ''}>
          ${bottomShare > 0 && !deviceShot ? '<div class="home"></div>' : ''}
        </div>
      </div>`;
  };

  /** The device's outer height for a given width, so callers can fit it. */
  window.deviceHeight = (frame, deviceW, screenAspect) => {
    const k = ({ island: .03, punch: .026, tablet: .036 })[frame];
    return deviceW * ((1 - 2 * k) / screenAspect + 2 * k);
  };

  /**
   * Lays out one store screenshot. Sizes are shares of the canvas, so one
   * layout serves every size; `frame` picks the device. `measureOnly`
   * returns where the copy ends, so frame.cjs can put the device at the same
   * height on every shot.
   */
  window.renderShot = async (data) => {
    const { width: W, height: H, frame, headline, subline, screenAspect, hero, icon, deviceTop: fixedTop, measureOnly } = data;
    const tablet = frame === 'tablet';
    const canvas = document.getElementById('canvas');
    const headlineSize = W * (tablet ? .062 : .088) * (W / H > .6 && !tablet ? .92 : 1);
    const deviceTop = fixedTop ?? H * (tablet ? .2 : .26);
    const maxW = W * (tablet ? .84 : .82);
    const deviceW = Math.min(maxW, (H * .968 - deviceTop) / (deviceHeight(frame, 1, screenAspect)));

    const vars = {
      '--w': W + 'px', '--h': H + 'px',
      '--dot': W * .03 + 'px',
      '--copy-top': H * (tablet ? .035 : .04) + 'px',
      '--copy-bottom': (measureOnly ? 0 : H - deviceTop + headlineSize * .6) + 'px',
      '--copy-align': measureOnly ? 'flex-start' : 'flex-end',
      '--headline-size': headlineSize + 'px',
      '--sub-size': headlineSize * .56 + 'px',
    };
    for (const [k, v] of Object.entries(vars)) canvas.style.setProperty(k, v);

    canvas.innerHTML = `
      <div class="copy">
        ${hero
          ? `<div class="brand"><img src="${icon}"><span>Kubernanny</span></div>`
          : LIGHTS}
        <h1>${esc(headline)}</h1>
        ${subline ? `<p class="sub">${esc(subline)}</p>` : ''}
      </div>
      ${deviceMarkup({ ...data, deviceW, style: `left:50%;top:${deviceTop}px;transform:translateX(-50%)` })}`;

    await document.fonts.ready;
    if (measureOnly) {
      return canvas.querySelector('.copy').lastElementChild.getBoundingClientRect().bottom + headlineSize * .6;
    }
    await Promise.all([...canvas.querySelectorAll('img')].map((img) => img.decode()));
    // Overflow check for frame.cjs: copy that runs into the device or off the canvas.
    const copy = canvas.querySelector('.copy');
    const h1 = canvas.querySelector('h1').getBoundingClientRect();
    const problems = [];
    if (h1.top < 0) problems.push('headline above the canvas');
    if (copy.scrollWidth > copy.clientWidth + 1) problems.push('copy wider than the canvas');
    return problems;
  };

  /**
   * The store banners (banners.cjs): the App Store's product page header and
   * search result asset, and Google Play's feature graphic, on the same
   * ground as the screenshots. `kind`:
   * - header: logo, name and claim on the left, two tilted devices on the right
   * - search: one line on top, three devices side by side
   * `shots` are { screenshot, deviceShot } in the order shown.
   */
  window.renderBanner = async (data) => {
    const { width: W, height: H, kind, frame, claim, line, icon, shots, screenAspect, statusShare, bottomShare, android, layout = {} } = data;
    const L = { claimSize: 9.6, nameSize: 6.4, textWidth: .46, textLeft: .065, phoneW: .19, phoneX: [.575, .765], phoneY: [12, 19], ...layout };
    const canvas = document.getElementById('canvas');
    const u = H / 100;
    for (const [k, v] of Object.entries({ '--w': W + 'px', '--h': H + 'px', '--dot': Math.max(W, H) * .02 + 'px' })) canvas.style.setProperty(k, v);
    const device = (shot, w, style) => deviceMarkup({ frame, deviceW: w, screenAspect, statusShare, bottomShare, android, ...shot, style });
    let html = '';
    if (kind === 'header') {
      html += `<div class="banner-text" style="left:${W * L.textLeft}px;width:${W * L.textWidth}px;font-size:${u}px">
          <div class="brand" style="font-size:${u * L.nameSize}px;gap:.45em;margin-bottom:0"><img src="${icon}" style="width:1.7em">Kubernanny</div>
          ${LIGHTS.replace('class="lights"', `class="lights" style="--headline-size:${u * L.claimSize}px;margin:${u * 5.5}px 0 ${u * 3}px"`)}
          <h1 style="font-size:${u * L.claimSize}px">${esc(claim)}</h1>
        </div>`;
      const w = W * L.phoneW;
      html += device(shots[1], w, `left:${W * L.phoneX[1]}px;top:${u * L.phoneY[1]}px;transform:rotate(8deg);transform-origin:50% 0;z-index:1`);
      html += device(shots[0], w, `left:${W * L.phoneX[0]}px;top:${u * L.phoneY[0]}px;transform:rotate(-6deg);transform-origin:50% 0;z-index:2`);
    } else {
      html += `<h1 class="banner-line" style="top:${u * 7}px;font-size:${W * .04}px">${esc(line)}</h1>`;
      const w = W * .25;
      [.1, .375, .65].forEach((x, i) => {
        html += device(shots[i], w, `left:${W * x}px;top:${u * 25}px`);
      });
    }
    canvas.innerHTML = html;
    await document.fonts.ready;
    await Promise.all([...canvas.querySelectorAll('img')].map((img) => img.decode()));
    const problems = [];
    const text = canvas.querySelector('.banner-text, .banner-line');
    if (text.scrollWidth > text.clientWidth + 1) problems.push('text wider than its column');
    return problems;
  };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const LIGHTS = '<div class="lights"><i style="background:#36d6a8"></i><i style="background:#f5b83d"></i><i style="background:#ff5d73"></i></div>';
</script>
</body>
</html>
