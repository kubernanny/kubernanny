# The Kubernanny relay on Cloudflare Workers (README.md in this folder).
name = "kubernanny-relay"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "AGENTS"
class_name = "AgentObject"

# The per-token push limit across all agents: one tiny object per FCM token digest.
[[durable_objects.bindings]]
name = "TOKENS"
class_name = "TokenLimiter"

# SQLite-backed Durable Objects. AgentObject holds the agent's WebSocket; its session and rate limits live in
# the socket's attachment, and it writes one storage row, the agent's push allowance, only after a push.
# With a dead man's switch deposit (docs/RELAY.md, "Dead man's switch") it also stores that deposit (row
# "deadman") and sets an alarm: every 5 minutes while the agent is connected, to notice one that vanished
# without a close, and once per message when the agent is away.
# Unproven connections cost no storage write (their timeout is an in-memory timer). TokenLimiter stores one
# bucket per token that was pushed to.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TokenLimiter"]

# Limits, the same variables as the Node relay (docs/RELAY.md). Unset ones use the defaults.
[vars]
RELAY_CALL_TIMEOUT_MS = "25000"
# The URL agents dial (RELAY_URL on the agent): registration proofs are made for it. Unset: the host each
# connect request was routed to, which on Cloudflare is one of this Worker's own routes.
# RELAY_PUBLIC_URL = "https://relay.example.com"
# CORS_ORIGINS = "*"
# Native push is off unless the secret FCM_SERVICE_ACCOUNT is set (docs/RELAY.md, "Native push"):
#   npx wrangler secret put FCM_SERVICE_ACCOUNT < service-account.json
# RELAY_PUSH = "off"   # turns it off even with the secret
# The dead man's switch is on wherever push is:
# RELAY_DEADMAN = "off"
# RELAY_DEADMAN_MAX_DEPOSITS = "8"          # messages per agent (one per device)
# RELAY_DEADMAN_MAX_BYTES = "1024"          # one sealed message, base64url characters
# RELAY_DEADMAN_DEPOSITS_PER_HOUR = "30"

# Your own domain instead of *.workers.dev:
# routes = [{ pattern = "relay.example.com", custom_domain = true }]
# Recommended: a Cloudflare rate limiting rule on /v1/agents/*/ws per IP (docs/RELAY.md, "Cloudflare Worker"),
# since a Worker has no per-address limit of its own.
