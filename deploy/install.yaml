# Kubernanny agent, plain manifests for `kubectl apply -f`. Same as the Helm chart
# with its defaults (namespace kubernanny, read-only plus the issue actions that
# are on by default, no ingress). Pair afterwards: kubectl -n kubernanny logs deploy/kubernanny
apiVersion: v1
kind: Namespace
metadata:
  name: kubernanny
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernanny
  namespace: kubernanny
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernanny
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, patch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [volumes, nodes, backups, backuptargets, replicas]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates, clusterissuers]
    verbs: [get, list]
  - apiGroups: [acme.cert-manager.io]
    resources: [challenges]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, scheduledbackups]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [create]
  - apiGroups: [upgrade.cattle.io]
    resources: [plans]
    verbs: [get, list]
  - apiGroups: [velero.io]
    resources: [backups]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, clustersecretstores]
    verbs: [get, list]
  - apiGroups: [secrets.infisical.com]
    resources: [infisicalsecrets, infisicalstaticsecrets, infisicaldynamicsecrets, infisicalpushsecrets]
    verbs: [get, list]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list]
  - apiGroups: [wgpolicyk8s.io]
    resources: [policyreports, clusterpolicyreports]
    verbs: [get, list]
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies, policies]
    verbs: [get, list]
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports, clustervulnerabilityreports]
    verbs: [get, list]
  - apiGroups: [templates.gatekeeper.sh]
    resources: [constrainttemplates]
    verbs: [get, list]
  # Gatekeeper makes one CRD per constraint kind; this group holds nothing else.
  - apiGroups: [constraints.gatekeeper.sh]
    resources: ["*"]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  # RKE2 and k3s record their etcd snapshots here.
  - apiGroups: [k3s.cattle.io]
    resources: [etcdsnapshotfiles]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list]
  - apiGroups: [traefik.io, traefik.containo.us]
    resources: [ingressroutes]
    verbs: [get, list]
  # The actions that are on by default (docs/PERMISSIONS.md).
  # uncordon (held to spec.unschedulable by the admission policy).
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  # cleanup-pods (held to finished pods by the admission policy).
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  # reconcile-now: the reconcile annotation, or cert-manager's Issuing condition.
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [patch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [patch]
  - apiGroups: [secrets.infisical.com]
    resources: [infisicalstaticsecrets]
    verbs: [patch]
  - apiGroups: [cert-manager.io]
    resources: [certificates/status]
    verbs: [patch]
  # longhorn-backup and velero-backup.
  - apiGroups: [longhorn.io]
    resources: [snapshots, backups]
    verbs: [create]
  - apiGroups: [velero.io]
    resources: [schedules]
    verbs: [get]
  - apiGroups: [velero.io]
    resources: [backups]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernanny
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernanny
subjects:
  - kind: ServiceAccount
    name: kubernanny
    namespace: kubernanny
---
# Where the agent keeps the problem history of the last 7 days and its own CPU
# and memory record, so a restart or a rollout continues the week. Created
# empty here; the agent writes its keys. Removed with the rest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernanny-history
  namespace: kubernanny
  labels:
    app.kubernetes.io/name: kubernanny
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernanny-keys
  namespace: kubernanny
rules:
  # Read its key pair and its device list (public keys only), update the
  # device list on pairing and revocation. Nothing else in the namespace.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubernanny-identity, kubernanny-devices]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubernanny-devices]
    verbs: [patch]
  # The switches set in the app (modules, actions, notifications).
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubernanny-settings]
    verbs: [get, patch]
  # The problem history and the own CPU and memory record (history/history-store.ts).
  # The ConfigMap is created empty below, so the agent needs no create for it.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubernanny-history]
    verbs: [get, patch]
  # create cannot be limited by name in Kubernetes RBAC; the agent only ever
  # creates the two Secrets and kubernanny-settings.
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
  # Which pod is in charge during a rolling update (lease/leader.ts): one named
  # Lease, renewed by the pod that sends notifications and runs actions.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [kubernanny]
    verbs: [get, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernanny-keys
  namespace: kubernanny
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernanny-keys
subjects:
  - kind: ServiceAccount
    name: kubernanny
    namespace: kubernanny
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernanny
  namespace: kubernanny
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  replicas: 1
  # Zero-downtime rollouts: the old pod serves until the new one is ready (/readyz);
  # a Lease decides which pod notifies, runs actions and holds the relay.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernanny
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernanny
    spec:
      serviceAccountName: kubernanny
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/kubernanny/agent:0.3.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_NAME
              value: homelab
            - name: LANGUAGE
              value: en
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # - name: NTFY_URL
            #   value: https://ntfy.sh/<long-random-topic>
            # - name: WEBHOOK_URL
            #   value: https://discord.com/api/webhooks/…
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 1
          # The internal API socket (end-to-end channel, admin CLI) lives in /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kubernanny
  namespace: kubernanny
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    app.kubernetes.io/name: kubernanny
---
# Limits the agent's write permissions to what its actions change (Kubernetes
# 1.30+; on older clusters `kubectl apply` reports these objects as unknown and
# applies the rest). Generated from the chart's templates/admission-policy.yaml;
# details in docs/PERMISSIONS.md. Delete them to go back to RBAC alone.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-argocd-applications
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [applications]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  variables:
    - name: refresh
      expression: "'argocd.argoproj.io/refresh'"
    - name: newAnn
      expression: "request.operation == 'UPDATE' ? object.metadata.?annotations.orValue({}) : {}"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?annotations.orValue({}) : {}"
    - name: opChanged
      expression: "request.operation == 'UPDATE' && object.?operation != oldObject.?operation"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete Applications
      reason: Forbidden
    - expression: >-
        object.?status == oldObject.?status
      # With actions.enabled: [argocd-terminate-op] (and only then): what `argocd app terminate-op`
      # has the API server write, a running operation's phase set to Terminating, nothing else of the status.
      message: the Kubernanny agent may not change an Application's status
      reason: Forbidden
    - expression: >-
        object.?spec == oldObject.?spec &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: the Kubernanny agent may only start a sync or a refresh, not change an Application
      reason: Forbidden
    - expression: >-
        variables.newAnn.all(k, k == variables.refresh || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k == variables.refresh || k in variables.newAnn) &&
        (!(variables.refresh in variables.newAnn) || variables.newAnn[variables.refresh] in ['hard', 'normal'])
      message: the Kubernanny agent may only set the refresh annotation
      reason: Forbidden
    - expression: >-
        !variables.opChanged || (
          has(object.operation) &&
          object.operation.?initiatedBy.?username == optional.of('kubernanny') &&
          object.operation.?initiatedBy.?automated.orValue(false) == false &&
          object.operation.?retry == optional.none() &&
          size(object.operation.?info.orValue([])) <= 1 &&
          object.operation.?info.orValue([]).all(i, i.name == 'Reason') &&
          object.operation.?sync.?syncStrategy.?hook.hasValue() &&
          object.operation.?sync.?syncStrategy.?hook.?force.orValue(false) == false &&
          object.operation.?sync.?syncStrategy.?apply == optional.none() &&
          object.operation.?sync.?prune.orValue(false) == false &&
          object.operation.?sync.?dryRun.orValue(false) == false &&
          object.operation.?sync.?syncOptions.orValue([]).all(o,
            o == 'ServerSideApply=true' ||
            o in oldObject.?spec.?syncPolicy.?syncOptions.orValue([])) &&
          object.operation.?sync.?autoHealAttemptsCount == optional.none() &&
          object.operation.?sync.?revision == optional.none() &&
          object.operation.?sync.?revisions == optional.none() &&
          object.operation.?sync.?source == optional.none() &&
          object.operation.?sync.?sources == optional.none() &&
          object.operation.?sync.?manifests == optional.none() &&
          object.operation.?sync.?resources == optional.none()
        )
      # An allowlist of the one operation the agent sends (actions.service.ts): a hook sync of
      # the Application as it is, by kubernanny, without prune, force, dry run, retry, another
      # revision, source, manifests or a resource subset; sync options only the app's own and
      # ServerSideApply=true (prune and Replace=true are opt-in, see the chart). Every field of Argo CD's
      # Operation schema is named here; a field a later Argo CD adds is not covered until listed.
      # With actions.enabled: [argocd-rollback] (and only then) the second branch also lets
      # the agent roll a manual-sync, single-source app back: the same hook sync, with
      # `revision` set to the revision of an entry the stored status.history holds for
      # the same repository; still no source, prune, options or anything else.
      message: the Kubernanny agent may only start a plain sync of the Application as it is
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-certificates
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cert-manager.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [certificates, certificates/status]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  variables:
    - name: others
      expression: "request.operation == 'UPDATE' ? object.status.?conditions.orValue([]).filter(c, c.type != 'Issuing') : []"
    - name: oldOthers
      expression: "request.operation == 'UPDATE' ? oldObject.status.?conditions.orValue([]).filter(c, c.type != 'Issuing') : []"
  validations:
    - expression: request.operation == 'UPDATE' && request.subResource == 'status'
      message: the Kubernanny agent may only renew a Certificate
      reason: Forbidden
    # cmctl renew: the Issuing condition True with reason ManuallyTriggered, nothing else.
    - expression: >-
        variables.others == variables.oldOthers &&
        object.status.?conditions.orValue([]).exists(c, c.type == 'Issuing' && c.status == 'True' && c.?reason.orValue('') == 'ManuallyTriggered') &&
        object.status.?notAfter == oldObject.status.?notAfter &&
        object.status.?notBefore == oldObject.status.?notBefore &&
        object.status.?renewalTime == oldObject.status.?renewalTime &&
        object.status.?revision == oldObject.status.?revision &&
        object.status.?nextPrivateKeySecretName == oldObject.status.?nextPrivateKeySecretName &&
        object.status.?lastFailureTime == oldObject.status.?lastFailureTime &&
        object.status.?failedIssuanceAttempts == oldObject.status.?failedIssuanceAttempts &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations
      message: the Kubernanny agent may only set the Issuing condition of a Certificate
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-cnpg-backups
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [backups]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  validations:
    - expression: request.operation == 'CREATE'
      message: the Kubernanny agent may only create Backups
      reason: Forbidden
    # Whether the named cluster exists cannot be checked here (a policy sees
    # only the request); CNPG fails a Backup of a missing cluster itself. The
    # CRD defaults `method` to barmanObjectStore before the policy runs, so that
    # value counts as "not set".
    - expression: >-
        object.spec.?cluster.?name.orValue('') != '' &&
        object.spec.?method.orValue('barmanObjectStore') == 'barmanObjectStore' &&
        object.spec.?target == optional.none() &&
        object.spec.?online == optional.none() &&
        object.spec.?onlineConfiguration == optional.none() &&
        object.spec.?pluginConfiguration == optional.none()
      message: the Kubernanny agent may only create a plain Backup naming a cluster
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-longhorn-backups
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [longhorn.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [snapshots, backups]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  variables:
    - name: labels
      expression: "request.operation == 'CREATE' ? object.metadata.?labels.orValue({}) : {}"
  validations:
    - expression: request.operation == 'CREATE'
      message: the Kubernanny agent may only create Longhorn snapshots and backups
      reason: Forbidden
    - expression: >-
        variables.labels[?'app.kubernetes.io/created-by'] == optional.of('kubernanny') &&
        (request.resource.resource == 'snapshots'
          ? object.spec.?createSnapshot.orValue(false) == true && object.spec.?volume.orValue('') != ''
          : object.spec.?snapshotName.orValue('') != '' && 'backup-volume' in variables.labels && object.spec.?backupMode.orValue('incremental') != 'full')
      message: the Kubernanny agent may only take a snapshot of a volume and back it up
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-nodes
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [nodes]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete nodes
      reason: Forbidden
    - expression: >-
        oldObject.spec.?unschedulable.orValue(false) == true &&
        object.spec.?unschedulable.orValue(false) == false &&
        object.spec.?taints == oldObject.spec.?taints &&
        object.spec.?podCIDR == oldObject.spec.?podCIDR &&
        object.spec.?podCIDRs == oldObject.spec.?podCIDRs &&
        object.spec.?providerID == oldObject.spec.?providerID &&
        object.spec.?configSource == oldObject.spec.?configSource &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: the Kubernanny agent may only uncordon a node
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-pods
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [pods]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  validations:
    - expression: request.operation == 'DELETE'
      message: the Kubernanny agent may not create or change pods
      reason: Forbidden
    # cleanup-pods: a finished pod. force-delete-terminating (opt-in): a pod already being deleted;
    # whether its node is down is checked by the agent, a policy cannot see the node.
    - expression: >-
        oldObject.status.?phase.orValue('') in ['Failed', 'Succeeded']
      message: the Kubernanny agent may only delete finished pods
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-reconcile
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [kustomizations]
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [helmreleases]
      - apiGroups: [external-secrets.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [externalsecrets]
      - apiGroups: [secrets.infisical.com]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [infisicalstaticsecrets]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  variables:
    - name: allowed
      expression: "['reconcile.fluxcd.io/requestedAt', 'force-sync', 'kubernanny.io/requested-at']"
    - name: newAnn
      expression: "request.operation == 'UPDATE' ? object.metadata.?annotations.orValue({}) : {}"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?annotations.orValue({}) : {}"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete these objects
      reason: Forbidden
    - expression: >-
        object.?spec == oldObject.?spec &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        variables.newAnn.all(k, k in variables.allowed || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k in variables.allowed || k in variables.newAnn)
      message: the Kubernanny agent may only set the reconcile annotation
      reason: Forbidden
---
---
# Source: kubernanny/templates/admission-policy.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-restart-daemonsets
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [daemonsets]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  variables:
    - name: restartedAt
      expression: "'kubectl.kubernetes.io/restartedAt'"
