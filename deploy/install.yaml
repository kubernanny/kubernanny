    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.spec.template.metadata.?annotations.orValue({}) : {}"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete workloads
      reason: Forbidden
    - expression: >-
        object.spec.template.spec == oldObject.spec.template.spec &&
        object.spec.template.metadata.?labels == oldObject.spec.template.metadata.?labels &&
        variables.newAnn.all(k, k == variables.restartedAt || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
