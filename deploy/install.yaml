---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-argocd-applications
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [applications]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  variables:
    - name: refresh
      expression: "'argocd.argoproj.io/refresh'"
    - name: newAnn
      expression: "request.operation == 'UPDATE' ? object.metadata.?annotations.orValue({}) : {}"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?annotations.orValue({}) : {}"
    - name: opChanged
      expression: "request.operation == 'UPDATE' && object.?operation != oldObject.?operation"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete Applications
      reason: Forbidden
    - expression: >-
        object.?spec == oldObject.?spec &&
        object.?status == oldObject.?status &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: the Kubernanny agent may only start a sync or a refresh, not change an Application
      reason: Forbidden
    - expression: >-
        variables.newAnn.all(k, k == variables.refresh || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k == variables.refresh || k in variables.newAnn) &&
        (!(variables.refresh in variables.newAnn) || variables.newAnn[variables.refresh] in ['hard', 'normal'])
      message: the Kubernanny agent may only set the refresh annotation
      reason: Forbidden
    - expression: >-
        !variables.opChanged || (
          has(object.operation) &&
          object.operation.?initiatedBy.?username == optional.of('kubernanny') &&
          object.operation.?sync.?revision == optional.none() &&
          object.operation.?sync.?revisions == optional.none() &&
          object.operation.?sync.?source == optional.none() &&
          object.operation.?sync.?sources == optional.none() &&
          object.operation.?sync.?manifests == optional.none() &&
          object.operation.?sync.?resources == optional.none()
        )
      message: the Kubernanny agent may only start a plain sync of the Application as it is
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-cnpg-backups
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [backups]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  validations:
    - expression: request.operation == 'CREATE'
      message: the Kubernanny agent may only create Backups
      reason: Forbidden
    # Whether the named cluster exists cannot be checked here (a policy sees
    # only the request); CNPG fails a Backup of a missing cluster itself.
    - expression: >-
        object.spec.?cluster.?name.orValue('') != '' &&
        object.spec.?method == optional.none() &&
        object.spec.?target == optional.none() &&
        object.spec.?online == optional.none() &&
        object.spec.?onlineConfiguration == optional.none() &&
        object.spec.?pluginConfiguration == optional.none()
      message: the Kubernanny agent may only create a plain Backup naming a cluster
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubernanny-restart-daemonsets
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  policyName: kubernanny-restart-daemonsets
  validationActions: [Deny]
