# Kubernanny agent, plain manifests for `kubectl apply -f`. Same as the Helm chart
# with its defaults (namespace kubernanny, read-only plus the four actions, no
# ingress). Pair afterwards: kubectl -n kubernanny logs deploy/kubernanny
apiVersion: v1
kind: Namespace
metadata:
  name: kubernanny
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernanny
  namespace: kubernanny
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernanny
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, events, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, patch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [volumes, nodes, backups, backuptargets]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates, clusterissuers]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [create]
  - apiGroups: [upgrade.cattle.io]
    resources: [plans]
    verbs: [get, list]
  - apiGroups: [velero.io]
    resources: [backups]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, clustersecretstores]
    verbs: [get, list]
  - apiGroups: [secrets.infisical.com]
    resources: [infisicalsecrets, infisicalstaticsecrets]
    verbs: [get, list]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list]
  - apiGroups: [wgpolicyk8s.io]
    resources: [policyreports, clusterpolicyreports]
    verbs: [get, list]
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies, policies]
    verbs: [get, list]
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports, clustervulnerabilityreports]
    verbs: [get, list]
  - apiGroups: [templates.gatekeeper.sh]
    resources: [constrainttemplates]
    verbs: [get, list]
  # Gatekeeper makes one CRD per constraint kind; this group holds nothing else.
  - apiGroups: [constraints.gatekeeper.sh]
    resources: ["*"]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  # RKE2 and k3s record their etcd snapshots here.
  - apiGroups: [k3s.cattle.io]
    resources: [etcdsnapshotfiles]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list]
  - apiGroups: [traefik.io, traefik.containo.us]
    resources: [ingressroutes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernanny
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernanny
subjects:
  - kind: ServiceAccount
    name: kubernanny
    namespace: kubernanny
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernanny-keys
  namespace: kubernanny
rules:
  # Read its key pair and its device list (public keys only), update the
  # device list on pairing and revocation. Nothing else in the namespace.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubernanny-identity, kubernanny-devices]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubernanny-devices]
    verbs: [patch]
  # The switches set in the app (modules, actions, notifications).
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubernanny-settings]
    verbs: [get, patch]
  # create cannot be limited by name in Kubernetes RBAC; the agent only ever
  # creates the two Secrets and the ConfigMap above.
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernanny-keys
  namespace: kubernanny
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernanny-keys
subjects:
  - kind: ServiceAccount
    name: kubernanny
    namespace: kubernanny
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernanny
  namespace: kubernanny
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernanny
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernanny
    spec:
      serviceAccountName: kubernanny
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/kubernanny/agent:0.3.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_NAME
              value: homelab
            - name: LANGUAGE
              value: en
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # - name: NTFY_URL
            #   value: https://ntfy.sh/<long-random-topic>
            # - name: WEBHOOK_URL
            #   value: https://discord.com/api/webhooks/…
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # The internal API socket (end-to-end channel, admin CLI) lives in /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kubernanny
  namespace: kubernanny
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    app.kubernetes.io/name: kubernanny
---
# Limits the agent's write permissions to what its actions change (Kubernetes
# 1.30+; on older clusters `kubectl apply` reports these objects as unknown and
# applies the rest). Generated from the chart's templates/admission-policy.yaml;
# details in docs/PERMISSIONS.md. Delete them to go back to RBAC alone.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-restart-daemonsets
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [daemonsets]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  variables:
    - name: restartedAt
      expression: "'kubectl.kubernetes.io/restartedAt'"
    - name: newAnn
      expression: "request.operation == 'UPDATE' ? object.spec.template.metadata.?annotations.orValue({}) : {}"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.spec.template.metadata.?annotations.orValue({}) : {}"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete workloads
      reason: Forbidden
    - expression: >-
        object.spec.template.spec == oldObject.spec.template.spec &&
        object.spec.template.metadata.?labels == oldObject.spec.template.metadata.?labels &&
        variables.newAnn.all(k, k == variables.restartedAt || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k == variables.restartedAt || k in variables.newAnn)
      message: the Kubernanny agent may only change the restartedAt annotation of the pod template
      reason: Forbidden
    - expression: >-
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.spec.?selector == oldObject.spec.?selector &&
        object.spec.?updateStrategy == oldObject.spec.?updateStrategy &&
        object.spec.?minReadySeconds == oldObject.spec.?minReadySeconds &&
        object.spec.?revisionHistoryLimit == oldObject.spec.?revisionHistoryLimit
      message: the Kubernanny agent may only restart a workload, not change it
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubernanny-restart-deployments
  labels:
    app.kubernetes.io/name: kubernanny
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == "system:serviceaccount:kubernanny:kubernanny"
  variables:
    - name: restartedAt
      expression: "'kubectl.kubernetes.io/restartedAt'"
    - name: newAnn
      expression: "request.operation == 'UPDATE' ? object.spec.template.metadata.?annotations.orValue({}) : {}"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.spec.template.metadata.?annotations.orValue({}) : {}"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete workloads
      reason: Forbidden
    - expression: >-
        object.spec.template.spec == oldObject.spec.template.spec &&
        object.spec.template.metadata.?labels == oldObject.spec.template.metadata.?labels &&
        variables.newAnn.all(k, k == variables.restartedAt || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k == variables.restartedAt || k in variables.newAnn)
      message: the Kubernanny agent may only change the restartedAt annotation of the pod template
      reason: Forbidden
    - expression: >-
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.spec.?replicas == oldObject.spec.?replicas &&
        object.spec.?selector == oldObject.spec.?selector &&
        object.spec.?strategy == oldObject.spec.?strategy &&
        object.spec.?minReadySeconds == oldObject.spec.?minReadySeconds &&
        object.spec.?revisionHistoryLimit == oldObject.spec.?revisionHistoryLimit &&
        object.spec.?progressDeadlineSeconds == oldObject.spec.?progressDeadlineSeconds &&
        object.spec.?paused == oldObject.spec.?paused
