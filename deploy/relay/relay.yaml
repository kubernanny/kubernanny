# A self-hosted Kubernanny relay (docs/RELAY.md).
#
#   kubectl apply -f https://raw.githubusercontent.com/kubernanny/kubernanny/v0.4.0/deploy/relay/relay.yaml x-release-please-version
#
# Run it OUTSIDE the clusters it serves (a small VPS, another cluster): a
# relay inside the cluster it monitors goes down together with it, exactly
# when you want to look. Then point agents at it:
#   helm upgrade kubernanny … --set relay.enabled=true --set relay.url=wss://relay.example.com
#
# One replica: an agent's WebSocket lives on one pod, and a call must reach
# that pod. More agents than one pod carries means another relay, not
# another replica (see docs/RELAY.md, "Sizing").
apiVersion: v1
kind: Namespace
metadata:
  name: kubernanny-relay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernanny-relay
  namespace: kubernanny-relay
  labels:
    app.kubernetes.io/name: kubernanny-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernanny-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernanny-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          # Pinned to a released version, bumped with every release (docs/RELEASING.md). Never :latest,
          # which changes under a running relay and cannot be rolled back.
          image: ghcr.io/kubernanny/relay:0.4.0 # x-release-please-version
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100
          env:
            # The URL agents dial (their RELAY_URL); registration proofs are made for it (docs/RELAY.md).
            - name: RELAY_PUBLIC_URL
              value: https://relay.example.com
            # Fair-use limits; every RELAY_* variable is listed in docs/RELAY.md.
            - name: RELAY_MAX_AGENTS
              value: "1000"
            # A relay for yourself can be generous.
            - name: RELAY_BYTES_PER_HOUR
              value: "1073741824"
            # Behind the ingress every connection comes from the controller, so the per-address limits
            # need the client address from a header the controller owns. This example assumes
            # ingress-nginx with its default use-forwarded-headers: false, where the controller sets
            # X-Real-IP from the connecting address itself; check it for your controller (send a
            # request with a made-up X-Real-IP and see that the relay's limits ignore it). Behind
            # Cloudflare use cf-connecting-ip. Avoid x-forwarded-for unless the proxy appends to it.
            - name: TRUST_PROXY
              value: x-real-ip
            # Memory ≈ 100 MB + agents × 25 KB + 2 × this (requests and answers held); fits the 256Mi limit below for 1000 agents.
            - name: RELAY_MAX_INFLIGHT_BYTES
              value: "67108864"
            # Native push (docs/RELAY.md, "Native push"): off unless a Firebase service account is given.
            # kubectl -n kubernanny-relay create secret generic relay-fcm --from-file=service-account.json=<key file>
            # - name: FCM_SERVICE_ACCOUNT
            #   valueFrom:
            #     secretKeyRef: { name: relay-fcm, key: service-account.json }
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubernanny-relay
  namespace: kubernanny-relay
  labels:
    app.kubernetes.io/name: kubernanny-relay
spec:
  selector:
    app.kubernetes.io/name: kubernanny-relay
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
---
# TLS in front: agents connect with wss://, the app with https://. The
# ingress must allow WebSockets and keep idle connections open longer than
# the agent's 25 s heartbeat (ingress-nginx's default of 60 s is enough;
# raise it if your proxy closes sooner).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernanny-relay
  namespace: kubernanny-relay
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: relay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernanny-relay
                port:
                  name: http
  tls:
    - hosts: [relay.example.com]
      secretName: kubernanny-relay-tls
---
# Only the ingress controller reaches the API, only Prometheus the metrics;
# the relay itself opens no connection to anything. With native push on it
# needs DNS and HTTPS to Google (oauth2.googleapis.com, fcm.googleapis.com):
# replace `egress: []` with rules for UDP/TCP 53 and TCP 443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernanny-relay
  namespace: kubernanny-relay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernanny-relay
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: metrics
  egress: []
