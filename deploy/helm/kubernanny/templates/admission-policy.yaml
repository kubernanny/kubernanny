apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-pvcs
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [persistentvolumeclaims]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  variables:
    - name: newSize
      expression: "request.operation == 'UPDATE' ? quantity(object.spec.resources.requests.storage).asApproximateFloat() : 0.0"
    - name: oldSize
      expression: "request.operation == 'UPDATE' ? quantity(oldObject.spec.resources.requests.storage).asApproximateFloat() : 0.0"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete volume claims
      reason: Forbidden
    - expression: >-
        object.spec.?accessModes == oldObject.spec.?accessModes &&
        object.spec.?selector == oldObject.spec.?selector &&
        object.spec.?storageClassName == oldObject.spec.?storageClassName &&
        object.spec.?volumeName == oldObject.spec.?volumeName &&
        object.spec.?volumeMode == oldObject.spec.?volumeMode &&
        object.spec.?dataSource == oldObject.spec.?dataSource &&
        object.spec.?dataSourceRef == oldObject.spec.?dataSourceRef &&
        object.spec.?volumeAttributesClassName == oldObject.spec.?volumeAttributesClassName &&
        object.spec.resources.?limits == oldObject.spec.resources.?limits &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers
      message: the Kubernanny agent may only change the size of a volume claim
      reason: Forbidden
    - expression: >-
        variables.newSize > variables.oldSize &&
        (variables.newSize <= variables.oldSize * 1.5 || variables.newSize <= variables.oldSize + 1073741824.0)
      message: the Kubernanny agent may only grow a volume claim, by half or 1 Gi at most
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-pvcs
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-pvcs
  validationActions: [Deny]
{{- end }}
