{{- /*
A ValidatingAdmissionPolicy that holds the agent's own write permissions to
what its actions change (docs/SECURITY.md, "the pod (RCE)"). RBAC can only say
"patch Deployments"; with this policy, a request from the agent's
ServiceAccount may only
  - on Deployments, StatefulSets, DaemonSets: change the pod template annotation
    kubectl.kubernetes.io/restartedAt (a restart), nothing else;
  - on Argo CD Applications: set `operation` to a plain sync (no other
    revision, source or manifests; sync options only the app's own and
    ServerSideApply=true) and the refresh annotation, nothing else; only with
    actions.enabled: [argocd-sync-prune] also with prune, while the app lists
    a resource to prune, and only with [argocd-sync-replace] also Replace=true;
    only with actions.enabled: [argocd-rollback], also a sync of a manual-sync,
    single-source app to a revision from its own status.history;
  - on CNPG Backups: create one that names only a cluster;
  - on nodes: turn spec.unschedulable from true to false (uncordon);
  - on pods: delete one that has finished (Failed or Succeeded); only with
    actions.enabled: [force-delete-terminating], also one already terminating;
  - on Flux Kustomizations and HelmReleases, ExternalSecrets and
    InfisicalStaticSecrets: set their reconcile annotation, nothing else;
  - on certificates/status: set the Issuing condition (cmctl renew);
  - on Longhorn: create a Snapshot and a Backup; on Velero: create a Backup
    labelled with its schedule;
  - on Jobs: delete one that has failed, of a CronJob or without owner
    (job-delete);
  - opt-in only: create a Job owned by a CronJob or labelled as a rerun
    (job-rerun), end a running Argo CD operation (argocd-terminate-op), raise
    a PVC's storage request by at most half (pvc-expand).
Everything else from the agent on these resources (other fields, create,
delete) is denied. Other users and controllers are not matched at all.

Needs Kubernetes 1.30+ (admissionregistration.k8s.io/v1). On older clusters
nothing is rendered and the chart notes say so.
*/ -}}
{{- $writes := include "kubernanny.enabledWriteActions" . | fromJsonArray }}
{{- if and .Values.rbac.admissionPolicy.enabled $writes (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- $agent := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "kubernanny.name" .) }}
{{- $prefix := printf "%s-%s" .Release.Name (include "kubernanny.name" .) }}
{{- /* Every spec field of each kind outside the pod template; none of them may change. */ -}}
{{- $workloads := dict
  "deployments" (list "replicas" "selector" "strategy" "minReadySeconds" "revisionHistoryLimit" "progressDeadlineSeconds" "paused")
  "statefulsets" (list "replicas" "selector" "serviceName" "podManagementPolicy" "updateStrategy" "revisionHistoryLimit" "minReadySeconds" "volumeClaimTemplates" "persistentVolumeClaimRetentionPolicy" "ordinals")
  "daemonsets" (list "selector" "updateStrategy" "minReadySeconds" "revisionHistoryLimit") }}
{{- if has "restart" $writes }}
{{- range $resource, $fields := $workloads }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-restart-{{ $resource }}
  labels:
    {{- include "kubernanny.labels" $ | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [{{ $resource }}]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  variables:
    - name: restartedAt
      expression: "'kubectl.kubernetes.io/restartedAt'"
    - name: newAnn
      expression: "request.operation == 'UPDATE' ? object.spec.template.metadata.?annotations.orValue({}) : {}"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.spec.template.metadata.?annotations.orValue({}) : {}"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete workloads
      reason: Forbidden
    - expression: >-
        object.spec.template.spec == oldObject.spec.template.spec &&
        object.spec.template.metadata.?labels == oldObject.spec.template.metadata.?labels &&
        variables.newAnn.all(k, k == variables.restartedAt || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k == variables.restartedAt || k in variables.newAnn)
      message: the Kubernanny agent may only change the restartedAt annotation of the pod template
      reason: Forbidden
    - expression: >-
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers
        {{- range $fields }} &&
        object.spec.?{{ . }} == oldObject.spec.?{{ . }}
        {{- end }}
      message: the Kubernanny agent may only restart a workload, not change it
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-restart-{{ $resource }}
  labels:
    {{- include "kubernanny.labels" $ | nindent 4 }}
spec:
  policyName: {{ $prefix }}-restart-{{ $resource }}
  validationActions: [Deny]
{{- end }}
{{- end }}
{{- $rollback := has "argocd-rollback" $writes }}
{{- $terminate := has "argocd-terminate-op" $writes }}
{{- $prune := has "argocd-sync-prune" $writes }}
{{- $replace := has "argocd-sync-replace" $writes }}
{{- if or (has "argocd-sync" $writes) (has "argocd-refresh" $writes) $rollback $terminate }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-argocd-applications
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [applications]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  variables:
    - name: refresh
      expression: "'argocd.argoproj.io/refresh'"
    - name: newAnn
      expression: "request.operation == 'UPDATE' ? object.metadata.?annotations.orValue({}) : {}"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?annotations.orValue({}) : {}"
    - name: opChanged
      expression: "request.operation == 'UPDATE' && object.?operation != oldObject.?operation"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete Applications
      reason: Forbidden
    - expression: >-
        object.?status == oldObject.?status
        {{- if $terminate }} || (
          oldObject.status.?operationState.?phase == optional.of('Running') &&
          object.status.?operationState.?phase == optional.of('Terminating') &&
          object.status.?operationState.?operation == oldObject.status.?operationState.?operation &&
          object.status.?operationState.?startedAt == oldObject.status.?operationState.?startedAt &&
          object.status.?operationState.?finishedAt == oldObject.status.?operationState.?finishedAt &&
          object.status.?operationState.?message == oldObject.status.?operationState.?message &&
          object.status.?operationState.?retryCount == oldObject.status.?operationState.?retryCount &&
          object.status.?operationState.?syncResult == oldObject.status.?operationState.?syncResult &&
          object.status.?sync == oldObject.status.?sync &&
          object.status.?health == oldObject.status.?health &&
          object.status.?history == oldObject.status.?history &&
          object.status.?resources == oldObject.status.?resources &&
          object.status.?conditions == oldObject.status.?conditions &&
          object.status.?summary == oldObject.status.?summary &&
          object.status.?sourceType == oldObject.status.?sourceType &&
          object.status.?sourceTypes == oldObject.status.?sourceTypes &&
          object.status.?reconciledAt == oldObject.status.?reconciledAt &&
          object.status.?observedAt == oldObject.status.?observedAt &&
          object.status.?controllerNamespace == oldObject.status.?controllerNamespace &&
          object.status.?resourceHealthSource == oldObject.status.?resourceHealthSource &&
          object.status.?sourceHydrator == oldObject.status.?sourceHydrator
        )
        {{- end }}
      # With actions.enabled: [argocd-terminate-op] (and only then): what `argocd app terminate-op`
      # has the API server write, a running operation's phase set to Terminating, nothing else of the status.
      message: the Kubernanny agent may not change an Application's status{{ if $terminate }}, except ending a running operation{{ end }}
      reason: Forbidden
    - expression: >-
        object.?spec == oldObject.?spec &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: the Kubernanny agent may only start a sync or a refresh, not change an Application
      reason: Forbidden
    - expression: >-
        variables.newAnn.all(k, k == variables.refresh || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k == variables.refresh || k in variables.newAnn) &&
        (!(variables.refresh in variables.newAnn) || variables.newAnn[variables.refresh] in ['hard', 'normal'])
      message: the Kubernanny agent may only set the refresh annotation
      reason: Forbidden
    - expression: >-
        !variables.opChanged || (
          has(object.operation) &&
          object.operation.?initiatedBy.?username == optional.of('kubernanny') &&
          object.operation.?initiatedBy.?automated.orValue(false) == false &&
          object.operation.?retry == optional.none() &&
          size(object.operation.?info.orValue([])) <= 1 &&
          object.operation.?info.orValue([]).all(i, i.name == 'Reason') &&
          object.operation.?sync.?syncStrategy.?hook.hasValue() &&
          object.operation.?sync.?syncStrategy.?hook.?force.orValue(false) == false &&
          object.operation.?sync.?syncStrategy.?apply == optional.none() &&
          {{- if $prune }}
          (object.operation.?sync.?prune.orValue(false) == false ||
            oldObject.?status.?resources.orValue([]).exists(r, r.?requiresPruning.orValue(false))) &&
          {{- else }}
          object.operation.?sync.?prune.orValue(false) == false &&
          {{- end }}
          object.operation.?sync.?dryRun.orValue(false) == false &&
          object.operation.?sync.?syncOptions.orValue([]).all(o,
            o == 'ServerSideApply=true' ||{{ if $replace }} o == 'Replace=true' ||{{ end }}
            o in oldObject.?spec.?syncPolicy.?syncOptions.orValue([])) &&
          object.operation.?sync.?autoHealAttemptsCount == optional.none() &&
          object.operation.?sync.?revision == optional.none() &&
          object.operation.?sync.?revisions == optional.none() &&
          object.operation.?sync.?source == optional.none() &&
          object.operation.?sync.?sources == optional.none() &&
          object.operation.?sync.?manifests == optional.none() &&
          object.operation.?sync.?resources == optional.none()
        )
        {{- if $rollback }} || (
          has(object.operation) &&
          object.operation.?initiatedBy.?username == optional.of('kubernanny') &&
          object.operation.?initiatedBy.?automated.orValue(false) == false &&
          object.operation.?retry == optional.none() &&
          size(object.operation.?info.orValue([])) <= 1 &&
          object.operation.?info.orValue([]).all(i, i.name == 'Reason') &&
          object.operation.?sync.?syncStrategy.?hook.hasValue() &&
          object.operation.?sync.?syncStrategy.?hook.?force.orValue(false) == false &&
          object.operation.?sync.?syncStrategy.?apply == optional.none() &&
          object.operation.?sync.?prune == optional.none() &&
          object.operation.?sync.?dryRun == optional.none() &&
          object.operation.?sync.?syncOptions == optional.none() &&
          object.operation.?sync.?autoHealAttemptsCount == optional.none() &&
          object.operation.?sync.?revisions == optional.none() &&
          object.operation.?sync.?source == optional.none() &&
          object.operation.?sync.?sources == optional.none() &&
          object.operation.?sync.?manifests == optional.none() &&
          object.operation.?sync.?resources == optional.none() &&
          oldObject.?spec.?syncPolicy.?automated == optional.none() &&
          oldObject.?spec.?sources == optional.none() &&
          oldObject.?spec.?source.?repoURL.hasValue() &&
          object.operation.?sync.?revision.hasValue() &&
          oldObject.?status.?history.orValue([]).exists(h,
            h.?revision == object.operation.?sync.?revision &&
            h.?source.?repoURL == oldObject.?spec.?source.?repoURL)
        )
        {{- end }}
      # An allowlist of the one operation the agent sends (actions.service.ts): a hook sync of
      # the Application as it is, by kubernanny, without force, dry run, retry, another revision,
      # source, manifests or a resource subset. Sync options: the app's own (spec.syncPolicy.syncOptions,
      # which Argo CD's Sync button copies too) and ServerSideApply=true; Replace=true only with
      # actions.enabled: [argocd-sync-replace]. Prune only with actions.enabled: [argocd-sync-prune],
      # and only while the stored status lists a resource that requires pruning. Every field of Argo CD's
      # Operation schema is named here; a field a later Argo CD adds is not covered until listed.
      # With actions.enabled: [argocd-rollback] (and only then) the second branch also lets
      # the agent roll a manual-sync, single-source app back: the same hook sync, with
      # `revision` set to the revision of an entry the stored status.history holds for
      # the same repository; still no source, prune, options or anything else.
      message: the Kubernanny agent may only start a plain sync of the Application as it is{{ if $rollback }}, or roll a manual-sync app back to a revision from its history{{ end }}
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-argocd-applications
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-argocd-applications
  validationActions: [Deny]
{{- end }}
{{- if has "cnpg-backup" $writes }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-cnpg-backups
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [backups]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  validations:
    - expression: request.operation == 'CREATE'
      message: the Kubernanny agent may only create Backups
      reason: Forbidden
    # Whether the named cluster exists cannot be checked here (a policy sees
    # only the request); CNPG fails a Backup of a missing cluster itself. The
    # CRD defaults `method` to barmanObjectStore before the policy runs, so that
    # value counts as "not set".
    - expression: >-
        object.spec.?cluster.?name.orValue('') != '' &&
        object.spec.?method.orValue('barmanObjectStore') == 'barmanObjectStore' &&
        object.spec.?target == optional.none() &&
        object.spec.?online == optional.none() &&
        object.spec.?onlineConfiguration == optional.none() &&
        object.spec.?pluginConfiguration == optional.none()
      message: the Kubernanny agent may only create a plain Backup naming a cluster
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-cnpg-backups
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-cnpg-backups
  validationActions: [Deny]
{{- end }}
{{- $cleanup := has "cleanup-pods" $writes }}
{{- $force := has "force-delete-terminating" $writes }}
{{- if has "uncordon" $writes }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-nodes
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [nodes]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete nodes
      reason: Forbidden
    - expression: >-
        oldObject.spec.?unschedulable.orValue(false) == true &&
        object.spec.?unschedulable.orValue(false) == false &&
        object.spec.?taints == oldObject.spec.?taints &&
        object.spec.?podCIDR == oldObject.spec.?podCIDR &&
        object.spec.?podCIDRs == oldObject.spec.?podCIDRs &&
        object.spec.?providerID == oldObject.spec.?providerID &&
        object.spec.?configSource == oldObject.spec.?configSource &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: the Kubernanny agent may only uncordon a node
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-nodes
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-nodes
  validationActions: [Deny]
{{- end }}
{{- if or $cleanup $force }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-pods
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [pods]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  validations:
    - expression: request.operation == 'DELETE'
      message: the Kubernanny agent may not create or change pods
      reason: Forbidden
    # cleanup-pods: a finished pod. force-delete-terminating (opt-in): a pod already being deleted;
    # whether its node is down is checked by the agent, a policy cannot see the node.
    - expression: >-
        {{- if $cleanup }}
        oldObject.status.?phase.orValue('') in ['Failed', 'Succeeded']
        {{- end }}
        {{- if and $cleanup $force }} ||{{ end }}
        {{- if $force }}
        has(oldObject.metadata.deletionTimestamp)
        {{- end }}
      message: the Kubernanny agent may only delete {{ if $cleanup }}finished pods{{ end }}{{ if and $cleanup $force }} or {{ end }}{{ if $force }}pods already terminating{{ end }}
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-pods
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-pods
  validationActions: [Deny]
{{- end }}
{{- $rerun := has "job-rerun" $writes }}
{{- $jobDelete := has "job-delete" $writes }}
{{- if or $rerun $jobDelete }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-jobs
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
{{- if $rerun }}
  variables:
    - name: labels
      expression: "request.operation == 'CREATE' ? object.metadata.?labels.orValue({}) : {}"
    - name: pod
      expression: "object.spec.template.spec"
    - name: containers
      expression: "request.operation == 'CREATE' ? object.spec.template.spec.containers + object.spec.template.spec.?initContainers.orValue([]) : []"
    - name: annotations
      expression: "request.operation == 'CREATE' ? object.spec.template.?metadata.?annotations.orValue({}) : {}"
    - name: capabilities
      expression: "['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']"
    - name: seLinuxTypes
      expression: "['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']"
    - name: sysctls
      expression: >-
        ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start',
        'net.ipv4.tcp_syncookies', 'net.ipv4.ping_group_range', 'net.ipv4.ip_local_reserved_ports',
        'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout', 'net.ipv4.tcp_keepalive_intvl',
        'net.ipv4.tcp_keepalive_probes', 'net.ipv4.tcp_rmem', 'net.ipv4.tcp_wmem',
        'net.ipv4.tcp_slow_start_after_idle', 'net.ipv4.tcp_notsent_lowat']
{{- end }}
  validations:
    - expression: >-
        request.operation in [{{ if $rerun }}'CREATE'{{ end }}{{ if and $rerun $jobDelete }}, {{ end }}{{ if $jobDelete }}'DELETE'{{ end }}]
      message: the Kubernanny agent may only {{ if $rerun }}create Jobs{{ end }}{{ if and $rerun $jobDelete }} or {{ end }}{{ if $jobDelete }}delete failed Jobs{{ end }}
      reason: Forbidden
{{- if $jobDelete }}
    # job-delete: a Job that has failed, of a CronJob or without owner (what the agent offers it for); never a running
    # or succeeded one, nor one another controller owns.
    - expression: >-
        request.operation != 'DELETE' || (
          oldObject.status.?conditions.orValue([]).exists(c, c.type == 'Failed' && c.status == 'True') &&
          (size(oldObject.metadata.?ownerReferences.orValue([])) == 0 ||
            (size(oldObject.metadata.?ownerReferences.orValue([])) == 1 &&
              oldObject.metadata.ownerReferences.exists(o, o.kind == 'CronJob' && o.apiVersion == 'batch/v1')))
        )
      message: the Kubernanny agent may only delete a failed Job of a CronJob or without owner
      reason: Forbidden
{{- end }}
{{- if $rerun }}
    # The template cannot be compared with the CronJob's here (a policy sees only the request);
    # that is why job-rerun is opt-in (docs/SECURITY.md).
    - expression: >-
        request.operation == 'DELETE' || (
          variables.labels[?'app.kubernetes.io/created-by'] == optional.of('kubernanny') &&
          object.spec.?manualSelector.orValue(false) == false &&
          ((size(object.metadata.?ownerReferences.orValue([])) == 1 &&
            object.metadata.ownerReferences.exists(o, o.kind == 'CronJob' && o.apiVersion == 'batch/v1' && o.?controller.orValue(false) == true)) ||
            ('kubernanny.io/rerun-of' in variables.labels && size(object.metadata.?ownerReferences.orValue([])) == 0))
        )
      message: the Kubernanny agent may only create a Job run of a CronJob or a rerun of a failed Job without owner
      reason: Forbidden
    # The Pod Security Standards "baseline" profile, at pod and container level, whatever the template
    # says (the agent refuses such a rerun itself: agent/src/actions/pod-security.ts), plus no
    # allowPrivilegeEscalation: true and no ephemeral containers.
    - expression: >-
        request.operation == 'DELETE' || (
          variables.pod.?hostNetwork.orValue(false) == false &&
          variables.pod.?hostPID.orValue(false) == false &&
          variables.pod.?hostIPC.orValue(false) == false &&
          variables.pod.?volumes.orValue([]).all(v, !has(v.hostPath)) &&
          size(variables.pod.?ephemeralContainers.orValue([])) == 0
        )
      message: the Kubernanny agent may not create a Job with host namespaces, hostPath volumes or ephemeral containers
      reason: Forbidden
    - expression: >-
        request.operation == 'DELETE' || (
          variables.pod.?securityContext.?windowsOptions.?hostProcess.orValue(false) == false &&
          variables.pod.?securityContext.?seLinuxOptions.?type.orValue('') in variables.seLinuxTypes &&
          variables.pod.?securityContext.?seLinuxOptions.?user.orValue('') == '' &&
          variables.pod.?securityContext.?seLinuxOptions.?role.orValue('') == '' &&
          variables.pod.?securityContext.?seccompProfile.?type.orValue('') != 'Unconfined' &&
          variables.pod.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'] &&
          variables.pod.?securityContext.?sysctls.orValue([]).all(s, s.name in variables.sysctls) &&
          variables.annotations.all(k, !k.startsWith('container.apparmor.security.beta.kubernetes.io/') ||
            variables.annotations[k] == 'runtime/default' || variables.annotations[k].startsWith('localhost/'))
        )
      message: the Kubernanny agent may not create a Job whose pod leaves the baseline profile (hostProcess, SELinux, seccomp, AppArmor, sysctls)
      reason: Forbidden
    - expression: >-
        request.operation == 'DELETE' || (
          variables.containers.all(c,
            c.?securityContext.?privileged.orValue(false) == false &&
            c.?securityContext.?allowPrivilegeEscalation.orValue(false) == false &&
            c.?securityContext.?capabilities.?add.orValue([]).all(x, x in variables.capabilities) &&
            c.?securityContext.?procMount.orValue('Default') == 'Default' &&
            c.?securityContext.?windowsOptions.?hostProcess.orValue(false) == false &&
            c.?securityContext.?seLinuxOptions.?type.orValue('') in variables.seLinuxTypes &&
            c.?securityContext.?seLinuxOptions.?user.orValue('') == '' &&
            c.?securityContext.?seLinuxOptions.?role.orValue('') == '' &&
            c.?securityContext.?seccompProfile.?type.orValue('') != 'Unconfined' &&
            c.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'] &&
            c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0))
        )
      message: the Kubernanny agent may not create a Job with a container that leaves the baseline profile (privileged, capabilities, procMount, hostProcess, SELinux, seccomp, AppArmor, hostPort)
      reason: Forbidden
    - expression: >-
        request.operation == 'DELETE' || (
          variables.containers.all(c,
            [c.?livenessProbe, c.?readinessProbe, c.?startupProbe].all(p, p.?httpGet.?host.orValue('') == '' && p.?tcpSocket.?host.orValue('') == '') &&
            [c.?lifecycle.?postStart, c.?lifecycle.?preStop].all(h, h.?httpGet.?host.orValue('') == '' && h.?tcpSocket.?host.orValue('') == ''))
        )
      message: the Kubernanny agent may not create a Job whose probes or lifecycle hooks name another host
      reason: Forbidden
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-jobs
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-jobs
  validationActions: [Deny]
{{- end }}
{{- if has "reconcile-now" $writes }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-reconcile
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [kustomizations]
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [helmreleases]
      - apiGroups: [external-secrets.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [externalsecrets]
      - apiGroups: [secrets.infisical.com]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [infisicalstaticsecrets]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  variables:
    - name: allowed
      expression: "['reconcile.fluxcd.io/requestedAt', 'force-sync', 'kubernanny.io/requested-at']"
    - name: newAnn
      expression: "request.operation == 'UPDATE' ? object.metadata.?annotations.orValue({}) : {}"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?annotations.orValue({}) : {}"
  validations:
    - expression: request.operation == 'UPDATE'
      message: the Kubernanny agent may not create or delete these objects
      reason: Forbidden
    - expression: >-
        object.?spec == oldObject.?spec &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        variables.newAnn.all(k, k in variables.allowed || (k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k])) &&
        variables.oldAnn.all(k, k in variables.allowed || k in variables.newAnn)
      message: the Kubernanny agent may only set the reconcile annotation
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-reconcile
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-reconcile
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-certificates
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cert-manager.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [certificates, certificates/status]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  variables:
    - name: others
      expression: "request.operation == 'UPDATE' ? object.status.?conditions.orValue([]).filter(c, c.type != 'Issuing') : []"
    - name: oldOthers
      expression: "request.operation == 'UPDATE' ? oldObject.status.?conditions.orValue([]).filter(c, c.type != 'Issuing') : []"
  validations:
    - expression: request.operation == 'UPDATE' && request.subResource == 'status'
      message: the Kubernanny agent may only renew a Certificate
      reason: Forbidden
    # cmctl renew: the Issuing condition True with reason ManuallyTriggered, nothing else.
    - expression: >-
        variables.others == variables.oldOthers &&
        object.status.?conditions.orValue([]).exists(c, c.type == 'Issuing' && c.status == 'True' && c.?reason.orValue('') == 'ManuallyTriggered') &&
        object.status.?notAfter == oldObject.status.?notAfter &&
        object.status.?notBefore == oldObject.status.?notBefore &&
        object.status.?renewalTime == oldObject.status.?renewalTime &&
        object.status.?revision == oldObject.status.?revision &&
        object.status.?nextPrivateKeySecretName == oldObject.status.?nextPrivateKeySecretName &&
        object.status.?lastFailureTime == oldObject.status.?lastFailureTime &&
        object.status.?failedIssuanceAttempts == oldObject.status.?failedIssuanceAttempts &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations
      message: the Kubernanny agent may only set the Issuing condition of a Certificate
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-certificates
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-certificates
  validationActions: [Deny]
{{- end }}
