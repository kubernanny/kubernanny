apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-velero-backups
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [velero.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [backups]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  validations:
    - expression: request.operation == 'CREATE'
      message: the Kubernanny agent may only create Velero backups
      reason: Forbidden
    # Whether the spec equals the schedule's template cannot be checked here; Velero writes only to configured locations.
    - expression: >-
        object.metadata.?labels.orValue({})[?'app.kubernetes.io/created-by'] == optional.of('kubernanny') &&
        object.metadata.?labels.orValue({})[?'velero.io/schedule-name'].orValue('') != ''
      message: the Kubernanny agent may only create a backup from a schedule
      reason: Forbidden
    # Hooks run commands in pods; a resource policy and an order steer what is read. None can be compared with
    # the schedule here, so none is allowed: the agent does not back up a schedule that uses them.
    - expression: >-
        !has(object.spec.hooks) &&
        !has(object.spec.resourcePolicy) &&
        !has(object.spec.orderedResources)
      message: the Kubernanny agent may not create a backup with hooks, a resource policy or an order
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-velero-backups
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  policyName: {{ $prefix }}-velero-backups
  validationActions: [Deny]
{{- end }}
