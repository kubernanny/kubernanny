apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $prefix }}-longhorn-backups
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [longhorn.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [snapshots, backups]
  matchConditions:
    - name: only-the-agent
      expression: request.userInfo.username == {{ $agent | quote }}
  variables:
    - name: labels
      expression: "request.operation == 'CREATE' ? object.metadata.?labels.orValue({}) : {}"
  validations:
    - expression: request.operation == 'CREATE'
      message: the Kubernanny agent may only create Longhorn snapshots and backups
      reason: Forbidden
    - expression: >-
        variables.labels[?'app.kubernetes.io/created-by'] == optional.of('kubernanny') &&
        (request.resource.resource == 'snapshots'
          ? object.spec.?createSnapshot.orValue(false) == true && object.spec.?volume.orValue('') != ''
          : object.spec.?snapshotName.orValue('') != '' && 'backup-volume' in variables.labels && object.spec.?backupMode.orValue('incremental') != 'full')
      message: the Kubernanny agent may only take a snapshot of a volume and back it up
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $prefix }}-longhorn-backups
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
