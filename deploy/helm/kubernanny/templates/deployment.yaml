{{- include "kubernanny.validateSwitches" . }}
{{- $notificationsLocked := include "kubernanny.notificationsLocked" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubernanny.name" . }}
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  # One replica. During a rollout the new pod starts next to the old one and
  # takes traffic once it has its first snapshot (/readyz); only the pod
  # holding the Lease "kubernanny" sends notifications, runs actions and
  # holds the relay, and the old one releases it on SIGTERM. So the page
  # never goes dark and nothing is sent twice.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "kubernanny.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubernanny.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubernanny.name" . }}
      # SIGTERM: unready, lease and relay handed over, 5 s more of answers while
      # the endpoints go, then in-flight requests finish (at most 10 s).
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The holder name in the Lease that decides which pod is in charge.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: LANGUAGE
              value: {{ .Values.language | default "en" | quote }}
            # Lets Node's fetch trust the API server.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            {{- with (include "kubernanny.publicUrl" .) }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: CHECK_INTERVAL_SECONDS
              value: {{ .Values.checks.intervalSeconds | quote }}
            - name: NOTIFY_AFTER_SECONDS
              value: {{ .Values.notifications.notifyAfterSeconds | quote }}
            - name: CERT_WARN_DAYS
              value: {{ .Values.checks.certWarnDays | quote }}
            - name: CERT_CRITICAL_DAYS
              value: {{ .Values.checks.certCriticalDays | quote }}
            - name: BACKUP_MAX_AGE_HOURS
              value: {{ .Values.checks.backupMaxAgeHours | quote }}
            {{- with .Values.checks.disabled }}
            - name: DISABLED_MODULES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with (include "kubernanny.disabledActions" . | fromJsonArray) }}
            - name: DISABLED_ACTIONS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with (.Values.actions).enabled }}
            - name: ENABLED_ACTIONS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.checks.prometheusUrl }}
            - name: PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.checks.alertmanagerUrl }}
            - name: ALERTMANAGER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.checks.systemNamespaces }}
            - name: SECURITY_SYSTEM_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- $enabledModules := list }}
            {{- if .Values.vulnerabilities.enabled }}{{- $enabledModules = append $enabledModules "vulnerabilities" }}{{- end }}
            {{- if (.Values.imageUpdates).enabled }}{{- $enabledModules = append $enabledModules "image-updates" }}{{- end }}
            {{- with $enabledModules }}
            - name: ENABLED_MODULES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if not .Values.vulnerabilities.allowAccept }}
            - name: VULN_ACCEPT
              value: "off"
            {{- end }}
            {{- with .Values.vulnerabilities.dbUrl }}
            - name: VULN_DB_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.customComponents }}
            - name: CUSTOM_COMPONENTS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- /* checks.disabled: [notifications] renders no channel at all, so not even a wrong agent could send. */}}
            {{- if not $notificationsLocked }}
            {{- with .Values.notifications.ntfyUrl }}
            - name: NTFY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.notifications.webhookUrl }}
            - name: WEBHOOK_URL
              value: {{ .Values.notifications.webhookUrl | quote }}
            {{- else if .Values.notifications.existingSecret }}
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.notifications.existingSecret }}
                  key: WEBHOOK_URL
                  optional: true
            {{- end }}
            {{- with .Values.notifications.existingSecret }}
            # Only these two keys of the Secret: the whole Secret as environment could set any variable (DEMO, RELAY_URL, K8S_API_URL, ...).
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: NTFY_TOKEN
                  optional: true
            {{- end }}
            {{- end }}
            - name: WEBHOOK_FORMAT
              value: {{ .Values.notifications.webhookFormat | quote }}
            - name: NOTIFY_DETAIL
              value: {{ .Values.notifications.detail | quote }}
            {{- if not .Values.notifications.appPush.enabled }}
            - name: APP_PUSH
              value: "off"
            {{- end }}
            {{- $widgetRefresh := .Values.notifications.appPush.widgetRefreshMinutes }}
            {{- if and (not (kindIs "invalid" $widgetRefresh)) (ne (int $widgetRefresh) 60) }}
            - name: WIDGET_REFRESH_MINUTES
              value: {{ int $widgetRefresh | toString | quote }}
            {{- end }}
            {{- if .Values.relay.enabled }}
            - name: RELAY_URL
              value: {{ required "relay.url is required when relay.enabled is true" .Values.relay.url | quote }}
            {{- end }}
            {{- if .Values.notifications.weeklyDigest.enabled }}
            - name: DIGEST
              value: weekly
            - name: DIGEST_WEEKDAY
              value: {{ .Values.notifications.weeklyDigest.weekday | quote }}
            - name: DIGEST_HOUR
              value: {{ .Values.notifications.weeklyDigest.hour | quote }}
            {{- end }}
            {{- with .Values.timezone }}
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Liveness: the process answers (no cluster call behind it).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          # Ready once the first check run is in memory (at most 90 s after
          # start), unready from SIGTERM on: a new pod never serves an empty page.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 1
          # The internal API socket (end-to-end channel, admin CLI) lives in /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
