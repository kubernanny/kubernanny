apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubernanny.name" . }}
  labels:
    {{- include "kubernanny.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    {{- include "kubernanny.selectorLabels" . | nindent 4 }}
