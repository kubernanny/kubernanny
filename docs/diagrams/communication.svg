<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!--
    Source of docs/communication.png: who talks to whom, and what protects it.
    The numbers are the channels of docs/COMMUNICATION.md. Edit this file, then
    render the PNG with `node scripts/diagrams/render.mjs` (needs e2e/ installed).
  -->
  <style>
    .bg { fill: #0f1626; }
    .zone { fill: none; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zone-label { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
    .box { fill: #172036; stroke: #2a3658; stroke-width: 1.5; }
    .box.agent { fill: #1c2a4a; stroke: #8ea2ff; stroke-width: 2.5; }
    .box.optional { stroke-dasharray: 5 4; }
    .title { fill: #e9edf7; font-size: 19px; font-weight: 700; }
    .sub { fill: #8d97b5; font-size: 14px; }
    .line { fill: none; stroke-width: 2.5; }
    .tls { stroke: #36d6a8; }
    .plain { stroke: #f5b83d; stroke-dasharray: 7 6; }
    .e2e { stroke: #8ea2ff; stroke-width: 4; }
    .api { stroke: #5b6788; stroke-width: 2; stroke-dasharray: 3 5; }
    .num { font-size: 14px; font-weight: 800; fill: #0f1626; text-anchor: middle; }
    .legend { fill: #c3cbe0; font-size: 14px; white-space: pre; }
    .heading { fill: #e9edf7; font-size: 30px; font-weight: 800; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#36d6a8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea2ff"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5b83d"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6788"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1100"/>
  <text x="40" y="52" class="heading">Kubernanny: who talks to whom, and what protects it</text>
  <text x="40" y="82" class="sub">Every app call is sealed end to end between the device key and the pinned agent key, also through the relay. Every push is sealed per phone. Actions come only from Kubernetes data.</text>

  <!-- zones -->
  <rect x="30" y="110" width="1540" height="820" rx="22" class="zone" stroke="#3a445e"/>
  <text x="52" y="138" class="zone-label" fill="#8d97b5">Internet</text>
  <rect x="600" y="160" width="660" height="750" rx="22" class="zone" stroke="#36d6a8"/>
  <text x="622" y="188" class="zone-label" fill="#36d6a8">Your Kubernetes cluster</text>

  <!-- outside, left -->
  <rect x="60" y="170" width="240" height="120" rx="16" class="box"/>
  <text x="80" y="206" class="title">FCM · APNs</text>
  <text x="80" y="232" class="sub">deliver the push to the phone</text>
  <text x="80" y="254" class="sub">see a sealed payload, the</text>
  <text x="80" y="274" class="sub">token and the timing</text>

  <rect x="340" y="170" width="230" height="200" rx="16" class="box optional"/>
  <text x="360" y="206" class="title">Relay (optional)</text>
  <text x="360" y="232" class="sub">public one or your own</text>
  <text x="360" y="256" class="sub">passes sealed calls on</text>
  <text x="360" y="280" class="sub">hands pushes to FCM</text>
  <text x="360" y="304" class="sub">holds the dead man's</text>
  <text x="360" y="326" class="sub">switch: sends it when the</text>
  <text x="360" y="348" class="sub">agent goes silent</text>

  <rect x="60" y="420" width="240" height="170" rx="16" class="box"/>
  <text x="80" y="456" class="title">Kubernanny app</text>
  <text x="80" y="482" class="sub">iOS · Android · browser</text>
  <text x="80" y="506" class="sub">own key pair per cluster</text>
  <text x="80" y="530" class="sub">home-screen widgets</text>
  <text x="80" y="554" class="sub">pinned agent key</text>

  <rect x="340" y="450" width="230" height="120" rx="16" class="box optional"/>
  <text x="360" y="486" class="title">VPN · LAN · ingress</text>
  <text x="360" y="512" class="sub">optional, TLS or not</text>
  <text x="360" y="534" class="sub">sees ciphertext only</text>

  <rect x="60" y="730" width="240" height="140" rx="16" class="box"/>
  <text x="80" y="766" class="title">You</text>
  <text x="80" y="792" class="sub">kubectl logs: the QR code</text>
  <text x="80" y="816" class="sub">kubectl exec: pair, list</text>
  <text x="80" y="840" class="sub">and revoke devices</text>

  <!-- cluster -->
  <rect x="630" y="330" width="300" height="250" rx="16" class="box agent"/>
  <text x="652" y="368" class="title">kubernanny agent</text>
  <text x="652" y="396" class="sub">checks every 60 s, watches</text>
  <text x="652" y="420" class="sub">actions bound to open issues</text>
  <text x="652" y="444" class="sub">Noise IK per call, audit log</text>
  <text x="652" y="468" class="sub">seals pushes per phone</text>
  <text x="652" y="492" class="sub">non-root, read-only FS</text>
  <text x="652" y="530" class="sub">:8080 API + web UI</text>
  <text x="652" y="554" class="sub">:9100 metrics</text>

  <rect x="980" y="200" width="250" height="140" rx="16" class="box"/>
  <text x="1000" y="236" class="title">Kubernetes API</text>
  <text x="1000" y="262" class="sub">RBAC: read, plus only</text>
  <text x="1000" y="284" class="sub">what the switched-on</text>
  <text x="1000" y="306" class="sub">actions need; admission</text>
  <text x="1000" y="328" class="sub">policies check each write</text>

  <rect x="980" y="400" width="250" height="150" rx="16" class="box"/>
  <text x="1000" y="436" class="title">Your tools</text>
  <text x="1000" y="462" class="sub">Argo CD · Longhorn · CNPG</text>
  <text x="1000" y="484" class="sub">Velero · cert-manager · …</text>
  <text x="1000" y="510" class="sub">read and acted on through</text>
  <text x="1000" y="532" class="sub">their resources in the API</text>

  <rect x="980" y="600" width="250" height="130" rx="16" class="box"/>
  <text x="1000" y="636" class="title">Secrets</text>
  <text x="1000" y="662" class="sub">kubernanny-identity</text>
  <text x="1000" y="684" class="sub">(the agent's key pair)</text>
  <text x="1000" y="708" class="sub">kubernanny-devices (public keys)</text>

  <rect x="630" y="640" width="300" height="120" rx="16" class="box"/>
  <text x="652" y="676" class="title">Monitoring</text>
  <text x="652" y="702" class="sub">Prometheus · Alertmanager</text>
  <text x="652" y="724" class="sub">Grafana · Loki</text>
  <text x="652" y="746" class="sub">read only, shown, never acted on</text>

  <rect x="630" y="790" width="300" height="96" rx="16" class="box"/>
  <text x="652" y="826" class="title">Pod log</text>
  <text x="652" y="852" class="sub">one-time pairing code and</text>
  <text x="652" y="874" class="sub">the agent's public key (QR)</text>

  <!-- outside, right -->
  <rect x="1300" y="200" width="250" height="150" rx="16" class="box"/>
  <text x="1320" y="236" class="title">Notifications</text>
  <text x="1320" y="262" class="sub">ntfy · Discord · Slack</text>
  <text x="1320" y="284" class="sub">Gotify · webhook</text>
  <text x="1320" y="310" class="sub">HTTPS, no redirects</text>
  <text x="1320" y="332" class="sub">detail: full or minimal</text>

  <rect x="1300" y="420" width="250" height="170" rx="16" class="box optional"/>
  <text x="1320" y="456" class="title">Registries · OSV</text>
  <text x="1320" y="482" class="sub">off by default</text>
  <text x="1320" y="508" class="sub">tag lists for image updates</text>
  <text x="1320" y="530" class="sub">advisories by package and</text>
  <text x="1320" y="552" class="sub">version; no cluster data</text>

  <!-- 1, 2: app to agent, end to end, directly -->
  <path d="M300,470 C460,410 560,400 626,410" class="line e2e" marker-end="url(#b)"/>
  <path d="M300,520 L336,520" class="line tls" marker-end="url(#g)"/>
  <path d="M570,520 L626,520" class="line plain" marker-end="url(#y)"/>
  <circle cx="470" cy="418" r="13" fill="#8ea2ff"/><text x="470" y="423" class="num">1</text>
  <circle cx="318" cy="545" r="13" fill="#36d6a8"/><text x="318" y="550" class="num">2</text>

  <!-- 10: agent dials out to the relay -->
  <path d="M700,326 C700,250 640,230 574,240" class="line tls" marker-end="url(#g)"/>
  <circle cx="678" cy="258" r="13" fill="#36d6a8"/><text x="678" y="263" class="num">10</text>
  <!-- 11: app to relay when the agent is out of reach -->
  <path d="M250,416 C270,380 300,330 336,320" class="line tls" marker-end="url(#g)"/>
  <circle cx="276" cy="372" r="13" fill="#36d6a8"/><text x="276" y="377" class="num">11</text>
  <!-- 12: push: relay to FCM to the phone -->
  <path d="M336,215 L304,215" class="line tls" marker-end="url(#g)"/>
  <path d="M120,290 L120,416" class="line tls" marker-end="url(#g)"/>
  <circle cx="320" cy="190" r="13" fill="#36d6a8"/><text x="320" y="195" class="num">12</text>

  <!-- 3: agent to the API; the API to your tools -->
  <path d="M930,360 C950,330 960,300 976,290" class="line tls" marker-end="url(#g)"/>
  <circle cx="948" cy="318" r="13" fill="#36d6a8"/><text x="948" y="323" class="num">3</text>
  <path d="M1105,340 L1105,396" class="line api" marker-end="url(#a)"/>
  <path d="M930,560 C950,600 960,640 976,650" class="line tls" marker-end="url(#g)"/>

  <!-- 4, 6: monitoring, inside the cluster network -->
  <path d="M740,580 L740,636" class="line plain" marker-end="url(#y)"/>
  <path d="M820,636 L820,584" class="line plain" marker-end="url(#y)"/>
  <circle cx="718" cy="608" r="13" fill="#f5b83d"/><text x="718" y="613" class="num">4</text>
  <circle cx="842" cy="608" r="13" fill="#f5b83d"/><text x="842" y="613" class="num">6</text>

  <!-- 5: notifications; 9: registries and OSV -->
  <path d="M880,326 C900,130 1250,120 1296,236" class="line tls" marker-end="url(#g)"/>
  <circle cx="1080" cy="160" r="13" fill="#36d6a8"/><text x="1080" y="165" class="num">5</text>
  <path d="M932,575 C958,610 955,700 957,760 C960,815 1290,800 1330,594" class="line tls" marker-end="url(#g)"/>
  <circle cx="1120" cy="785" r="13" fill="#36d6a8"/><text x="1120" y="790" class="num">9</text>

  <!-- 7, 8: you, through kubectl -->
  <path d="M300,820 L626,830" class="line tls" marker-end="url(#g)"/>
  <circle cx="460" cy="825" r="13" fill="#36d6a8"/><text x="460" y="830" class="num">7</text>
  <path d="M300,760 C450,700 560,620 626,560" class="line tls" marker-end="url(#g)"/>
  <circle cx="470" cy="690" r="13" fill="#36d6a8"/><text x="470" y="695" class="num">8</text>

  <!-- legend -->
  <line x1="40" y1="962" x2="84" y2="962" class="line e2e"/>
  <text x="96" y="967" class="legend">end to end: Noise IK per call, device key and pinned agent key; whatever carries it (relay, ingress, VPN) sees ciphertext</text>
  <line x1="40" y1="992" x2="84" y2="992" class="line tls"/>
  <text x="96" y="997" class="legend">TLS, server certificate verified</text>
  <line x1="420" y1="992" x2="464" y2="992" class="line plain"/>
  <text x="476" y="997" class="legend">inside the cluster network (encrypted by your CNI if it runs over WireGuard or IPsec)</text>
  <text x="40" y="1032" class="legend">1 status, details, actions, sealed per call  ·  2 pairing: one-time code in, device key registered  ·  3 list, get, watch; writes only for actions  ·  4 GET only  ·  5 issue texts or only counts</text>
  <text x="40" y="1058" class="legend">6 numbers only  ·  7 QR code  ·  8 pair, list, revoke  ·  9 names and versions only  ·  10 sealed calls, push and dead man's switch frames  ·  11 the same bytes as 1  ·  12 push sealed per phone</text>
</svg>
